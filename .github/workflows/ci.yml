name: CI

# 分工（见 AGENT.md §8）：
#   本地能跑 → npm run verify（SSOT 校验 + 纯函数单测，不需要浏览器）
#   本地跑不了 → 本工作流的 e2e（真实 Chromium）
#
# 本地沙箱/容器里 Chromium 可能起不来，e2e 一律以本工作流为准。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: '跑全部 e2e 用例（默认只跑发布前白名单 15 个）'
        type: boolean
        default: false

jobs:
  verify:
    name: SSOT + 单元测试（无浏览器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单一数据源校验
        run: node tools/check-ssot.mjs
      - name: 单元测试
        run: node --test tests/unit/*.test.mjs
      - name: 构建（存在 build 脚本时才跑，为重构预留）
        run: npm run build --if-present

  e2e:
    name: e2e（真实 Chromium）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 准备 Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: 跑 e2e
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          if [ "${{ inputs.full_e2e }}" = "true" ]; then
            node tests/run-e2e.mjs --all
          else
            node tests/run-e2e.mjs
          fi
      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/*.png
          if-no-files-found: ignore
          retention-days: 7
