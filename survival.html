<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14100c">
<meta name="description" content="末日废土文字生存点击游戏：采集、制作、探索、战斗、附魔，纯本地存档，可离线游玩。">
<!-- PWA：可安装 + 独立窗口 + 离线（v2.0.0） -->
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="末日余烬">
<meta name="application-name" content="末日余烬">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
<!-- iOS 启动图（游戏为深色主题，统一用深色版） -->
<link rel="apple-touch-startup-image" href="./splash/splash-iphone13-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash/splash-iphone15pro-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash/splash-iphone15promax-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash/splash-iphonex-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash/splash-iphoneSE-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="./splash/splash-ipad12-2048x2732.png" media="(device-width:1024px) and (device-height:1366px) and (-webkit-device-pixel-ratio:2)">
<title>末日余烬 · 文字生存</title>
<style>
:root{
  --bg:#14100c; --bg2:#1d1712; --bg3:#26201a; --line:#3a3128;
  --txt:#e8dcc8; --txt-dim:#a99a82; --txt-faint:#7a6d59;
  --accent:#e07b39; --accent2:#c25e25;
  --red:#d9503e; --orange:#e0a13a; --blue:#4fa8d8; --yellow:#e8d23a; --green:#6db35a;
  --ok:#7cb668; --warn:#d9a13a; --bad:#d9503e;
  --shadow:0 2px 8px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  user-select:none; -webkit-user-select:none;
}
/* 禁止 iOS Safari 双击缩放手势 */
*, *:before, *:after { touch-action: manipulation; }
html, body { touch-action: manipulation; -ms-touch-action: manipulation; }

/* ============ 顶部状态栏 ============ */
#statusbar{
  background:linear-gradient(180deg,#221a13,#1a140e);
  border-bottom:1px solid var(--line);
  padding:6px 10px calc(6px + env(safe-area-inset-top));
  padding-top:calc(6px + env(safe-area-inset-top));
  flex-shrink:0; z-index:5;
}
#topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#dayinfo{font-size:12px;color:var(--txt-dim);line-height:1.5}
#dayinfo b{color:var(--accent)}
#topbtns{display:flex;gap:6px}
.iconbtn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.iconbtn:active{background:#352a20}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-dim)}
.stat .lab{width:26px;flex-shrink:0}
.stat .bar{flex:1;height:9px;background:#0e0b08;border-radius:5px;overflow:hidden;border:1px solid #2a231b}
.stat .fill{height:100%;border-radius:4px;transition:width .35s ease}
.stat .val{width:26px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--txt)}
/* ============ 日志区 ============ */
#activebar{
  flex-shrink:0; display:none; align-items:center; justify-content:space-between;
  padding:5px 12px; background:#2a241a; border-bottom:1px solid var(--line);
  font-size:12px; color:var(--yellow);
}
#activebar b{color:var(--txt)}
#activeStop{
  border:1px solid var(--line);background:var(--bg3);color:var(--txt-dim);
  border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;
}
#logwrap{
  flex:1; overflow-y:auto; padding:10px 12px; 
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#logwrap::-webkit-scrollbar{display:none}
.logline{font-size:13.5px;line-height:1.65;color:var(--txt-dim);padding:1px 0;animation:fadein .25s ease}
.logline.sys{color:var(--txt-faint);font-size:12px}
.logline.good{color:var(--ok)}
.logline.bad{color:var(--bad)}
.logline.warn{color:var(--warn)}
.logline.info{color:var(--accent)}
.logline.tit{color:var(--txt);font-weight:600;margin-top:8px}
.logline.ev{color:var(--yellow)}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* ============ 底部操作区 ============ */
#bottom{
  flex-shrink:0; background:var(--bg2); border-top:1px solid var(--line);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));
  padding-bottom: max(calc(8px + env(safe-area-inset-bottom)), 44px); /* 兼容 iOS Safari URL 栏遮挡 */
}
#tabs{display:flex;gap:5px;margin-bottom:6px}
.tab{
  flex:1;padding:7px 0;border-radius:7px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt-dim);font-size:12.5px;cursor:pointer;text-align:center;
}
.tab.on{background:var(--accent);border-color:var(--accent);color:#201207;font-weight:700}
#btnFold{
  flex-shrink:0;width:30px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt-dim);font-size:11px;cursor:pointer;
}
#btnFold:active{background:#38302a}
#zonebar{display:flex;gap:5px;margin-bottom:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#zonebar::-webkit-scrollbar{display:none}
.zonebtn{
  flex-shrink:0;padding:4px 11px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt-dim);font-size:11.5px;cursor:pointer;
  transition:all .15s;
}
/* 各区域独立颜色（默认态用浅色背景，选中态用饱和色 + 高亮） */
.zonebtn.zone-forest{background:rgba(74,107,72,.15);color:#7a9a78;border-color:rgba(74,107,72,.4)}
.zonebtn.zone-forest.on{background:#2d4a2b;border-color:#4a6b48;color:#a8d4a4;box-shadow:0 0 8px rgba(74,107,72,.5)}
.zonebtn.zone-ruins {background:rgba(160,112,64,.15);color:#c09868;border-color:rgba(160,112,64,.4)}
.zonebtn.zone-ruins.on {background:#5a4020;border-color:#a07040;color:#d4a878;box-shadow:0 0 8px rgba(160,112,64,.5)}
.zonebtn.zone-river {background:rgba(90,138,170,.18);color:#7aaaca;border-color:rgba(90,138,170,.4)}
.zonebtn.zone-river.on {background:#1a3a5a;border-color:#5a8aaa;color:#a8d4f4;box-shadow:0 0 8px rgba(90,138,170,.5)}
.zonebtn.zone-hills {background:rgba(154,122,192,.15);color:#b09ad0;border-color:rgba(154,122,192,.4)}
.zonebtn.zone-hills.on {background:#3a2a5a;border-color:#9a7ac0;color:#d0bff4;box-shadow:0 0 8px rgba(154,122,192,.5)}
.zonebtn.zone-pyramid{background:rgba(200,168,74,.18);color:#d4b878;border-color:rgba(200,168,74,.4)} /* v1.29.8 修复：沙漠按钮未选/选中区分 */
.zonebtn.zone-pyramid.on{background:#5a4010;border-color:#c8a84a;color:#f4e0a0;box-shadow:0 0 8px rgba(200,168,74,.5)}
#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-height:50vh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
#actions::-webkit-scrollbar{display:none}
/* 小屏（手机）2 列布局：3 列太挤文字截断，1 列又吃掉日志区，2 列最平衡 */
@media (max-width:480px){
  #actions{grid-template-columns:repeat(2,1fr);gap:6px;max-height:52vh}
  .actbtn{padding:8px 6px;min-height:46px;flex-direction:column;justify-content:center;gap:2px;min-width:0;overflow:hidden}
  .actbtn .sub{font-size:10.5px;line-height:1.3;white-space:normal;max-width:100%;overflow-wrap:break-word;word-break:break-word;max-height:4em;overflow:hidden}
  .actbtn .lv{font-size:10px;right:4px;bottom:3px;padding:1px 5px}
  /* 制作页的占整行说明（背包提示）也正常 */
  .actbtn.big{flex-direction:row}
}
.actbtn{
  position:relative;
  padding:6px 3px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg3);color:var(--txt);font-size:12.5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:44px;min-width:0;overflow:hidden;
  transition:background .15s;
}
.actbtn .sub{font-size:9.5px;color:var(--txt-faint);line-height:1.3;white-space:normal;overflow-wrap:break-word;word-break:break-word;max-width:100%;max-height:3.6em;overflow:hidden}
/* Lv 等级徽章：右下角绝对定位，加浅背景避免溢出且醒目 */
.actbtn .lv{position:absolute;right:3px;bottom:2px;font-size:9.5px;color:var(--accent);font-weight:700;line-height:1;background:rgba(255,255,255,.07);padding:1px 4px;border-radius:4px;letter-spacing:.2px}
/* 消耗类按钮的库存数量徽章 */
.actbtn .stock{font-weight:700;color:var(--txt-dim);background:rgba(255,255,255,.05);padding:0 4px;border-radius:4px;margin-left:3px;font-size:10px}
.actbtn:active{background:#38302a}
.actbtn:disabled{opacity:.38;pointer-events:none}
.actbtn.big{grid-column:1 / -1}
.actbtn.running{background:#3a2f14;border-color:var(--yellow);color:var(--yellow)}
.actbtn.running .sub{color:#c9b45a}
.bagrow{
  grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font-size:12.5px;margin-bottom:5px;
}
.craft-sep{
  grid-column:1 / -1;font-size:11px;color:var(--txt-faint);
  margin:4px 2px 1px;letter-spacing:1px;border-bottom:1px dashed var(--line);padding-bottom:2px;
}
/* 制作页区块快捷导航 */
.craftnav{grid-column:1/-1;display:flex;gap:4px;margin:2px 0 4px}
.cnav{flex:1;font-size:10.5px;padding:5px 0;border-radius:7px;border:1px solid var(--line);background:var(--bg3);color:var(--txt-dim);cursor:pointer}
.cnav:active{background:#38302a}
.bagrow .cnt{color:var(--txt-dim)}
.bagrow .sell{
  border:1px solid var(--line);background:var(--bg3);color:var(--txt);
  border-radius:6px;padding:4px 10px;font-size:11.5px;cursor:pointer;flex-shrink:0;margin-left:8px;
}
.bagrow .sell:active{background:#38302a}
.skillrow{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;font-size:12.5px}
/* 百科图鉴 */
.wiki-row{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;font-size:12.5px}
.wiki-row.done{border-color:rgba(255,200,60,.35)}
.wiki-head{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wiki-tag{font-size:9.5px;color:var(--txt-faint);border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:400}
.wiki-line{font-size:11.5px;line-height:1.7;color:var(--txt-dim)}
.wiki-line b{color:var(--yellow)}
.wiki-line.faint{color:var(--txt-faint)}
/* 出售对话框 */
.sellqtyrow{display:flex;align-items:stretch;gap:8px;margin-top:10px}
#sellNum{
  flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:#0e0b08;color:var(--yellow);font-size:20px;font-weight:700;text-align:center;
  font-variant-numeric:tabular-nums;
}
.sellqtybtns{display:flex;gap:8px}
.sellqtybtns .mbtn{width:56px;margin-top:0;padding:8px 0;font-size:13px}
.sellgain{text-align:center;font-size:14px;color:var(--txt-dim);margin:12px 0 4px}
.sellgain b{color:var(--yellow);font-size:20px}
/* 进度总览 */
.prow{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ptitle{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;color:var(--txt);margin-bottom:6px}
.ptag{font-size:11px;color:var(--accent);font-weight:700}
.pbar{height:10px;background:#0e0b08;border:1px solid #2a231b;border-radius:6px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:6px;transition:width .4s}
.pnum{font-size:10.5px;color:var(--txt-faint);margin-top:3px;text-align:right}
.pnote{font-size:11.5px;color:var(--txt-dim);margin-top:5px;line-height:1.5}
.wpnrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px}
.wpn{font-size:11.5px;padding:2px 7px;border-radius:10px;background:#1a150e;border:1px solid var(--line);color:var(--txt-faint)}
.wpn.owned{background:#2a2418;border-color:var(--accent2);color:var(--yellow)}
.warrow{color:var(--txt-faint);font-size:10px}
.achlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ach{font-size:11px;padding:2px 8px;border-radius:10px;background:#1a150e;border:1px solid var(--line);color:var(--txt-faint)}
.ach.on{background:#1f2a16;border-color:#3d5a2a;color:var(--ok)}
/* ============ 弹窗 ============ */
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
#modal.show{display:flex}
#modalcard{
  width:100%;max-width:460px;max-height:82dvh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:slideup .22s ease;
}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
#modalcard h3{font-size:16px;margin-bottom:4px;color:var(--txt)}
#modalcard .msub{font-size:12px;color:var(--txt-faint);margin-bottom:12px}
.mbtn{
  display:block;width:100%;padding:13px;margin-top:9px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg3);color:var(--txt);
  font-size:14px;cursor:pointer;text-align:center;
}
.mbtn:active{background:#38302a}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:#201207;font-weight:700}
.mbtn.danger{background:#3a1d18;border-color:#5c2a20;color:#f0a08a}
textarea#exportArea{
  width:100%;min-height:70px;margin-top:9px;padding:9px;border-radius:9px;
  background:#0e0b08;border:1px solid var(--line);color:var(--txt);
  font-size:11px;word-break:break-all;font-family:monospace;
}
.field{font-size:13px;color:var(--txt-dim);margin:10px 0 3px}
/* 死亡结算 */
#deathcard{text-align:center;padding:26px 10px}
#deathcard .big{font-size:30px;color:var(--red);font-weight:800;letter-spacing:4px;margin:8px 0}
#deathcard .title{font-size:14px;color:var(--txt-dim)}
#deathcard .days{font-size:44px;color:var(--accent);font-weight:800;margin:10px 0 2px}
#deathcard .rank{font-size:15px;color:var(--yellow);margin-bottom:14px}
.statsgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.statsgrid .si{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:8px}
.statsgrid .si b{display:block;font-size:17px;color:var(--txt)}
.statsgrid .si span{font-size:11px;color:var(--txt-faint)}
/* 事件选项 */
.evbox{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.evbox .evt{font-size:14px;line-height:1.7;color:var(--txt);margin-bottom:10px}
.evbtn{display:block;width:100%;padding:12px;margin-top:7px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:14px;cursor:pointer;text-align:left}
.evbtn:active{background:#38302a}
.evbtn:first-of-type{margin-top:0}
.evbtn .d{display:block;font-size:11px;color:var(--txt-faint);margin-top:2px}
#evmask{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:60;display:none;align-items:flex-end;justify-content:center;overflow-y:auto;padding:0}
#evmask.show{display:flex}
#evmask .wrap{width:100%;max-width:460px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:slideup .22s ease}
#evmask h4{color:var(--yellow);font-size:15px;margin-bottom:8px}
.toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:#2a2219;border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:20px;
  font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}
/* 二维码 */
#qrbox{
  background:#fff;border-radius:12px;padding:12px;margin:10px 0;
  display:flex;flex-direction:column;align-items:center;
}
#qrbox canvas{width:100%;max-width:250px;height:auto;image-rendering:pixelated}
#qrbox .qhint{font-size:11px;color:#555;margin-top:6px;text-align:center;line-height:1.5}
/* 扫码全屏层 */
#scanner{
  position:fixed;inset:0;background:#000;z-index:90;display:none;
  flex-direction:column;
}
#scanner.show{display:flex}
#scanner video{flex:1;width:100%;object-fit:cover}
#scanner .sframe{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  width:220px;height:220px;border:3px solid var(--accent);border-radius:12px;
  box-shadow:0 0 0 4000px rgba(0,0,0,.55);
}
#scanner .sbar{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
  width:216px;height:3px;background:var(--accent);
  animation:scanmove 1.6s ease-in-out infinite;box-shadow:0 0 12px var(--accent);
}
@keyframes scanmove{0%,100%{transform:translate(-50%,-120px)}50%{transform:translate(-50%,120px)}}
#scanner .stop{
  position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--accent);color:#201207;font-weight:700;border:none;
  padding:13px 34px;border-radius:24px;font-size:15px;z-index:5;
}
#scanner .tip{
  position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;
  color:#ddd;font-size:13px;z-index:5;
}
/* ============ PWA 提示条（安装 / 更新 / 离线，v2.0.0） ============ */
#pwaBanner{
  position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:99998;display:none;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,#e8913a,#c25e25);color:#1a1108;
  font-size:13px;font-weight:700;line-height:1.35;
  padding:11px 14px;border-radius:11px;
  box-shadow:0 8px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25);
  animation:pwaIn .28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pwaIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#pwaBanner .pwa-x{
  display:inline-block;margin-left:10px;padding:0 4px;opacity:.6;font-size:15px;
}
</style>
</head>
<body>

<!-- 顶部状态栏 -->
<div id="statusbar">
  <div id="topline">

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

/* 计算升级到 lv+1 的总成本（11-15 级额外需要符文/合金） */
function upgradeCost(key, lv){
  const u=UPGRADES[key]; if(!u) return {};
  const cost={};
  for(const k in u.base) cost[k]=Math.round(u.base[k]*(lv+1));
  if(lv>=10){ cost.rune=(lv-9); cost.alloy=Math.round((lv-9)*1.5); }
  return cost;
}

function enchantTblCost(lv){ // lv=当前等级(0起)，升到 lv+1 的成本
  return {stone: 4*(lv+1), metal: 2*(lv+1), rune: (lv+1)};
}

function enchantCost(kind, lv){ // lv=当前等级，升到 lv+1 的成本
  const c={}; const b=ENCHANTS[kind].base;
  for(const k in b) c[k]=b[k]*(lv+1);
  return c;
}
function enchantItem(kind){
  if(!G.items.enchantTbl){ toast('需要先制作🔮附魔台'); return; }
  const cur=G.enchant[kind]||0;
  const cap=G.enchant.tblLv||0;
  if(cur>=cap){ toast('附魔台等级不足，请先升级附魔台'); return; }
  const cost=enchantCost(kind, cur);
  if(!hasRes(cost)){ toast('材料不足'); return; }
  for(const k in cost) spend(k,cost[k]);
  G.enchant[kind]=cur+1;
  G.stats.craft++;
  log(`✨ ${ENCHANTS[kind].name} 附魔提升到 Lv.${cur+1}！${ENCHANTS[kind].desc}`,'good');
  passTime(1);
  renderAll(); save();
}
function upgradeEnchantTbl(){
  if(!G.items.enchantTbl){ toast('需要先制作🔮附魔台'); return; }
  const cur=G.enchant.tblLv||0;
  if(cur>=ENCHANT_TBL_MAX){ toast('附魔台已满级'); return; }
  const cost=enchantTblCost(cur);
  if(!hasRes(cost)){ toast('材料不足'); return; }
  for(const k in cost) spend(k,cost[k]);
  G.enchant.tblLv=cur+1;
  log(`🔮 附魔台升级到 Lv.${cur+1}/5！现在可附魔至 ${cur+1} 级。`,'good');
  passTime(2);
  renderAll(); save();
}

function wikiSeen(id){

/* 老存档迁移：按历史击杀/探索数粗略补解锁（一次性，仅 fmt<11 触发） */
function legacyBestiary(g){
  const b={};
  const k=(g.stats&&g.stats.kills)||0;
  [1,2,3,4].forEach((n,i)=>{ if(k>=n) b['beast'+i]=1; });           // 野狗/灰狼/野猪/黑熊
  const zc=(g.stats&&g.stats.zoneCnt)||{};
  if((zc.forest||0)>=1) b['zone-forest']=1;
  if((zc.river||0)>=1)  b['zone-river']=1;
  if((zc.hills||0)>=1)  b['zone-hills']=1;
  if((zc.ruins||0)>=1){ b['rob0']=1; if((zc.ruins||0)>=3) b['rob1']=1; if((zc.ruins||0)>=6) b['rob2']=1; }
  if((zc.pyramid||0)>=1){ b['pyr0']=1; if((zc.pyramid||0)>=3) b['pyr1']=1; if((zc.pyramid||0)>=6) b['pyr2']=1; }
  const bk=(g.stats&&g.stats.bossKills)||0;                          // 兽王三阶段
  [1,2,3].forEach((n,i)=>{ if(bk>=n) b['boss'+i]=1; });
  const pk=(g.stats&&g.stats.pharaohKills)||0;                       // 法老三阶段
  [1,2,3].forEach((n,i)=>{ if(pk>=n) b['pharaoh'+i]=1; });
  if(k>=6)  b['moon-dog']=1;                                         // 月圆进化（粗略按总击杀）
  if(k>=10) b['moon-wolf']=1;
  return b;
}

  const fav=G.npcDora.fav||0;
  let cur=DORA_LEVELS[0];
  for(const L of DORA_LEVELS){ if(fav>=L.need) cur=L; }
  // 下一级所需
  const next=DORA_LEVELS.find(L=>L.lvl===cur.lvl+1)||null;
  return {fav, lvl:cur.lvl, name:cur.name, nextNeed: next?next.need-fav : 0, max:!next};
}
function addDoraFav(n){
  if(!G.npcDora) G.npcDora={fav:0};
  const before=doraInfo();
  G.npcDora.fav=(G.npcDora.fav||0)+n;
  const after=doraInfo();
  if(after.lvl>before.lvl){
    log(`🤖 猫耳机器人的眼睛亮了亮：「好感度提升！我们现在是「${after.name}」啦！」`,'good');
    if(after.lvl>=6) checkMilestone('dora6');
  }
}

/* 装备系统（参考 Minecraft 护甲）：皮革→铜→铁→银→金→钢，减伤逐级提升 */
/* 装备系统（参考 Minecraft）：4 部位（头/身/腿/脚）× 6 材质（皮/铜/铁/银/金/钢）
   材质升级链：做高级材质需要低级材质成品（制作时消耗替换升级） */
const ARMOR_MATS = ['leather','copper','iron','silver','gold','steel'];
const ARMOR_MAT_INFO = {
  leather:{name:'🦺皮', dmg:0.97, cost:{leather:6}},
  copper: {name:'🥉铜', dmg:0.95, cost:{copper:4, leather:1}},
  iron:   {name:'🛡铁', dmg:0.92, cost:{metal:5, leather:1}},
  silver: {name:'🥈银', dmg:0.90, cost:{silver:4, leather:1}},
  gold:   {name:'🥇金', dmg:0.88, cost:{gold:4, leather:1}},
  steel:  {name:'⚙️钢', dmg:0.85, cost:{alloy:5, leather:1}},
};
const ARMOR_SLOTS = {
  head: {name:'头盔'},
  body: {name:'胸甲'},
  legs: {name:'裤子'},
  boots:{name:'靴子'},
};
function armorSlotKey(slot){ return 'armor'+slot[0].toUpperCase()+slot.slice(1); }
function armorSlotMat(slot){ const k=armorSlotKey(slot); return G.items[k]||'none'; }
/* 总减伤倍率：4 部位乘算 × 符甲 × 保护附魔 */
function armorDmgMult(){
  let m=1;
  for(const s in ARMOR_SLOTS){
    const info=ARMOR_MAT_INFO[armorSlotMat(s)];
    if(info) m*=info.dmg;
  }
  const rune = G.items.runeArmor ? 1/3 : 1;
  const ench = 1 - ((G.enchant&&G.enchant.armor)||0)*0.08;
  return Math.max(0.1, m * rune * ench);
}
/* 套装成就检查：某材质 4 部位齐 → 触发对应成就 */
function checkArmorSet(){
  if(!G.stats.setsWorn) G.stats.setsWorn=[];
  for(const m of ARMOR_MATS){
    if(Object.keys(ARMOR_SLOTS).every(s=>armorSlotMat(s)===m)){
      checkMilestone('set'+m[0].toUpperCase()+m.slice(1));
      if(m==='iron') checkMilestone('armorIron');
      if(m==='steel') checkMilestone('armorSteel');
      if(!G.stats.setsWorn.includes(m)) G.stats.setsWorn.push(m);
    }
  }
  if(G.stats.setsWorn.length>=6){ checkMilestone('setsAll'); checkMilestone('armorAll'); }
}
/* 制作/升级护甲（slot: head/body/legs/boots, mat: leather~steel）
   高级材质需要低级材质成品（升级链），制作后自动穿戴 */
function craftArmor(slot, mat){
  const sk=armorSlotKey(slot);
  const mats=ARMOR_MATS; const idx=mats.indexOf(mat);
  if(idx<0 || !ARMOR_SLOTS[slot]) return;
  const cur=armorSlotMat(slot);
  if(cur===mat){ toast('已经装备'+ARMOR_MAT_INFO[mat].name+ARMOR_SLOTS[slot].name); return; }
  if(idx>0){
    const needPrev=mats[idx-1];
    if(cur!==needPrev){ toast(`升级链：需先装备${ARMOR_MAT_INFO[needPrev].name}${ARMOR_SLOTS[slot].name}`); return; }
  }
  const cost=ARMOR_MAT_INFO[mat].cost;
  if(!hasRes(cost)){ toast('材料不足'); return; }
  for(const k in cost) spend(k,cost[k]);
  G.items[sk]=mat;
  G.stats.craft++;
  if(!G.stats.armorsWorn) G.stats.armorsWorn=[];
  if(!G.stats.armorsWorn.includes(slot+':'+mat)) G.stats.armorsWorn.push(slot+':'+mat);
  checkMilestone('armor1');
  checkArmorSet();
  const full = Object.keys(ARMOR_SLOTS).every(s=>armorSlotMat(s)===mat);
  log(`🛡 你穿上了${ARMOR_MAT_INFO[mat].name}${ARMOR_SLOTS[slot].name}${full?'（套装达成！）':''}。`,'good');
  renderAll(); save();
}

/* 交易 helper：give 资源换 get 资源（任一不足则整体取消并 warn） */
function trade(give, get){
  for(const k in give){
    if((G.res[k]||0) < give[k]){
      log(`💰 商人皱了皱眉：「你连${RES_NAMES[k]}都凑不够${give[k]}个啊。」`,'warn');
      return false;
    }
  }
  for(const k in give) spend(k, give[k]);
  for(const k in get) addRes(k, get[k]);
  return true;
}

/* 随机抽取 n 个不重复商品（自动过滤 _hide 隐藏的，如「未制作配方=0」时图纸商品） */
function pickMerchantGoods(n, ctx){
  ctx = ctx || G;
  const pool = MERCHANT_GOODS.filter(g => !g._hide || !g._hide(ctx));
  // 洗牌
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0, Math.min(n, pool.length));
}

/* 迷路事件选项（v1.30.2）：丢硬币选路（金币不足禁用）+ 闭眼转圈随机路口 */
function lostOpts(){
  return [
    {label:'继续前进', d:'精力 -10，一无所获', eff:g=>{g.stam=Math.max(0,g.stam-10)}},
    {label:'🪙 丢硬币选路', d:(G.gold>=100
        ? '花费 💰100 · 正面：走对路精力不扣+小发现 / 反面：精力-10'
        : `<span style="color:var(--bad);font-weight:700">❌ 金币不够（${G.gold||0}/100）</span>`),
      disabled:G.gold<100,
      // 参数用 _g 避免遮蔽（沿用 v1.27.6 教训）
      eff:(_g)=>{
        if(G.gold < 100){ log('💰 你掏了掏口袋，凑不出 100 金币。','warn'); return; }
        G.gold -= 100;
        if(Math.random() < 0.5){
          const finds=[['food',rnd(3,6)],['clean',rnd(2,4)],['leather',rnd(1,2)],['metal',rnd(1,3)]];
          const f=finds[Math.floor(Math.random()*finds.length)];
          addRes(f[0], f[1]);
          log(`🪙 硬币正面！你抄了条隐蔽捷径，还在路边发现 ${RES_NAMES[f[0]]} ×${f[1]}。`,'good');
        } else {
          G.stam=Math.max(0,G.stam-10);
          log('🪙 硬币反面……你自信地走岔了路，绕了个大圈。','bad');
        }
      }},
    {label:'🧭 闭眼转圈', d:'转 3 圈停下指向路口：东(好)/南(顺)/西(荆棘)/北(迷路)', eff:(_g)=>{
      const dirs=[
        {n:'🧭东', do:()=>{ G.stam=Math.max(0,G.stam-5); addRes('food', rnd(2,4)); log('🧭 你指向东——竟是一条正确小路！还捡到几份吃的。','good'); }},
        {n:'🧭南', do:()=>{ G.stam=Math.max(0,G.stam-5);  log('🧭 南边意外顺畅，你很快找回了方向。','info'); }},
        {n:'🧭西', do:()=>{ G.stam=Math.max(0,G.stam-10); G.hp=Math.max(1,G.hp-5); log('🧭 西边是荆棘丛！你被刮得满身是伤。','bad'); }},
        {n:'🧭北', do:()=>{ G.stam=Math.max(0,G.stam-15); log('🧭 北边越走越深，你彻底绕晕了。','bad'); }},
      ];
      const d=dirs[Math.floor(Math.random()*dirs.length)];
      log(`你闭上眼转了 3 圈，停下时指向${d.n}路口——`,'ev');
      d.do();
    }},
  ];
}

/* ---------------- 工具函数 ---------------- */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function addRes(k,n){ if(!(k in G.res)) G.res[k]=0; G.res[k]+=n; if(n>0 && G.stats){ if(!G.stats.ownedRes) G.stats.ownedRes={}; G.stats.ownedRes[k]=1; } }
function spend(k,n){ if((G.res[k]||0)>=n){ G.res[k]-=n; return true } return false }
function hasRes(cost){ for(const k in cost){ if((G.res[k]||0)<cost[k]) return false } return true }
function has(k){return !!G.items[k]}
function nowPhase(){return G.hour>=6 && G.hour<18 ? '白天':'夜晚'}
function weaponAtk(){
  const base = G.items.runeBlade ? WEAPONS.runeBlade : (G.items.huntKing ? WEAPONS.huntKing : (G.items.steel ? WEAPONS.steel : (G.items.iron ? WEAPONS.iron : (G.items.knife ? WEAPONS.knife : WEAPONS.none))));
  // 🗡 锋利附魔：武器伤害 +10%/级
  const sharp = (G.enchant && G.enchant.weapon)||0;
  return {name:base.name, atk:Math.round(base.atk*(1+sharp*0.10)), baseAtk:base.atk, mult:base.mult, sharp};
}

function log(msg, cls){
  logBuffer.push({m:msg, c:cls||'sys'});
  if(logBuffer.length>300) logBuffer.shift();
  renderLog();
}

/* ---------------- 时间推进 ---------------- */
function passTime(h){
  // 肾上腺素计时递减（6 小时内状态不降）
  if(G.adrenalineLeft>0) G.adrenalineLeft = Math.max(0, G.adrenalineLeft - h);
  G.hour += h;
  while(G.hour>=24){ G.hour-=24; nextDay(); }
  // 每小时自然消耗（简化：按行动后结算）
  tick();
}
function nextDay(){
  G.day++; G.stats.days=G.day;
  G.season = Math.floor((G.day-1)/10)%4;
  // 天气
  const r=Math.random();
  if(G.season===3){ G.weather = r<.45?0: r<.7?1 : r<.85?2 : r<.95?3:4; }
  else{ G.weather = r<.5?0 : r<.75?1 : r<.9?2 : 4; }
  // 后期生存压力：第 30 天起每日消耗 +15%
  const late = G.day>30 ? 1.15 : 1;
  // 永恒仓库：每日食物水消耗减半
  const consumeMult = (has('vault') ? 0.5 : 1);
  // 每日消耗（肾上腺素期间水分/饥饿不下降）
  if(!isAdrenaline()){
    G.food = clamp(G.food - Math.round((G.weather>=3?18:15)*late*consumeMult), 0, 100);
    G.water= clamp(G.water - Math.round((G.weather===4?28:20)*late*consumeMult), 0, 100);
  }
  // —— 设施每日维护（缺料当日停摆）——
  G.offToday={fire:false, puri:false, trap:false};
  for(const f in MAINT){
    if(!G.items[f]) continue;
    let missing=[];
    for(const k in MAINT[f]){
      const need=MAINT[f][k];
      if((G.res[k]||0)>=need){ G.res[k]-=need; }
      else missing.push(`${RES_NAMES[k]||k}×${need}`);
    }
    if(missing.length){
      G.offToday[f]=true;
      log(`⚠ ${RECIPES[f].name}因缺少材料（${missing.join('、')}）今日停摆！`,'warn');
    } else if(f==='fire' && G.season===3){
      log(`火堆烧掉了 ${RES_NAMES.wood} ×1 维持温暖。`,'sys');
    }
  }
  // 捕兽夹（含强化加成；暴雨/暴风雪捕获率下降）
  if(has('trap') && !G.offToday.trap){
    const trapMul=[1,1,0.85,0.55,0.7][G.weather]||1;
    const f=Math.round(rnd(3,6)*(1+(G.upgrades.trap||0)*0.15)*trapMul);
    if(f>0){ addRes('food',f); log(`捕兽夹捕获了${RES_NAMES.food} ×${f}${trapMul<1?`（${WEATHERS[G.weather]}，捕获打折）`:''}。`,'good'); }
    else log('恶劣天气让捕兽夹一无所获。','warn');
  }
  // 净水器（小雨反而多产，暴雨水浑浊减产）
  if(has('puri') && !G.offToday.puri){
    const puriMul=[1,1,1.3,0.8,0.6][G.weather]||1;
    const w=Math.round(rnd(2,4)*puriMul);
    addRes('clean',w); G.res.water=Math.max(0,(G.res.water||0)-rnd(0,2));
    log(`净水器产出了${RES_NAMES.clean} ×${w}${puriMul!==1?`（${WEATHERS[G.weather]}影响）`:''}。`,'good');
  }
  // 温室（暴雨/暴风雪减产）
  if(has('farm')){
    const farmMul=[1,1,0.8,0.55,0.3][G.weather]||1;
    const f=Math.round(rnd(4,8)*farmMul);
    if(f>0){ addRes('food',f); log(`温室收获了${RES_NAMES.food} ×${f}${farmMul<1?`（${WEATHERS[G.weather]}，产量打折）`:''}。`,'good'); }
    else log('暴风雪压垮了温室作物，今天颗粒无收。','warn');
  }
  // 自动厨房（Tier 5）：每日自动烹饪 10 生食 → 15 熟食
  if(has('autokitchen')){
    const n=Math.min(G.res.food||0, 10);
    if(n>0){ spend('food',n); const out=Math.round(n*1.5); addRes('cooked',out); log(`🍲 自动厨房把${RES_NAMES.food} ×${n} 做成了${RES_NAMES.cooked} ×${out}。`,'good'); }
    else log('🍲 自动厨房空转——没有生食可烹饪。','warn');
  }
  // 太阳能烧水壶（Tier 5）：受天气影响严重（晴 100% → 暴风雪 0%）
  if(has('solarBoiler')){
    const sunMul=[1,0.7,0.4,0.15,0][G.weather]||0;
    if(sunMul<=0){ log('☀️ 太阳能烧水壶因'+WEATHERS[G.weather]+'停摆——没有阳光。','warn'); }
    else{
      const n=Math.min(G.res.water||0, Math.round(12*sunMul));
      if(n>0){ spend('water',n); addRes('clean',n); log(`☀️ 太阳能烧水壶（${WEATHERS[G.weather]}，${Math.round(sunMul*100)}%效率）烧开了${RES_NAMES.water} ×${n}，得到${RES_NAMES.clean} ×${n}。`,'good'); }
      else log('☀️ 太阳能烧水壶空转——没有生水可烧。','warn');
    }
  }
  // 火堆取暖
  if(G.season===3 && (!has('fire')||G.offToday.fire) && G.hour<6){ G.hp=clamp(G.hp-4,0,100); log('冬夜的严寒让你生命缓缓流失……','bad'); }
  if(G.season===3 && has('fire') && !G.offToday.fire){ G.hp=clamp(G.hp+2,0,100); }
  // 夜间事件
  if(G.hour>=20 || G.hour<6){
    rollNightEvent();
  }
  // 状态负面
  applyPassive();
  log(`—— 第 ${G.day} 天 · ${SEASONS[G.season]}季 · ${WEATHERS[G.weather]} ——`,'tit');
  checkMilestone(G.day);
  renderAll(); save();
}
function tick(){
  // 饥饿/口渴持续伤害
  applyPassive();
  checkDeath();
}
function applyPassive(){
  // 肾上腺素生效期间：生命/状态不下降
  if(!isAdrenaline()){
    if(G.food<=0){ G.hp=clamp(G.hp-6,0,100); log('你饿得头晕眼花……','bad'); }
    if(G.water<=0){ G.hp=clamp(G.hp-8,0,100); log('你渴得嘴唇干裂……','bad'); }
    if(G.ill){ G.hp=clamp(G.hp-5,0,100); }
    if(G.heavyWound){ G.hp=clamp(G.hp-4,0,100); }
    else if(G.lightWound){ G.hp=clamp(G.hp-2,0,100); }
  }
  if(G.food<25) log('⚠ 饱食见底，快找吃的！','warn');
  if(G.water<25) log('⚠ 水分见底，快去找水！','warn');
}

/* ---------------- 随机事件 ---------------- */
function rollExploreEvent(zone){
  // 废土兽王：30 天后首次遭遇；击败后可再次遭遇（45 天 CD，更强的狂暴/灭世形态）
  const bk=G.stats.bossKills||0;
  if(G.day>=30 && Math.random()<(bk>0?0.04:0.06) && (bk===0 || G.day>=45+G.stats.bossFirstAt)){ startBossFight(false); return; }
  // 金字塔法老：25 天后在金字塔区域有概率遭遇（可重复，3 阶段递进；每次击败后 30 天 CD）
  if(zone.key==='pyramid' && G.day>=25){
    const pk=G.stats.pharaohKills||0;
    const cdDay=pk>0 && G.stats.pharaohFirstAt ? (G.stats.pharaohFirstAt+30) : 0;
    if(pk<3 && Math.random()<0.05 && (pk===0 || G.day>=cdDay)){ startPharaohFight(); return; }
  }
  const r=Math.random();
  if(r < zone.danger){ startCombat(1); return; }
  // 从事件池按权重选（区域专属事件 + 通用事件）
  const pool=[];
  EXPLORE_EVENTS.forEach(e=>{
    if(e.zone && e.zone!==curZone) return; // 区域专属事件只在该区域出现
    for(let i=0;i<e.w;i++) pool.push(e);
  });
  const raw = pool[Math.floor(Math.random()*pool.length)];
  // 流浪商人：动态生成 4 个商品（不污染原 ev）
  if(raw._kind === 'merchant'){
    const goods = pickMerchantGoods(4);
    showEvent({
      ...raw,
      opts: goods.map(g=>{
        const giveStr = Object.keys(g.give||{}).map(k=>`${RES_NAMES[k]}×${g.give[k]}`).join('+');
        const getKeys = Object.keys(g.get||{});
        const getStr  = getKeys.map(k=>`${RES_NAMES[k]}×${g.get[k]}`).join('+');
        const costStr = g.cost ? `💰${g.cost}` : '';
        const dParts = [];
        if(costStr) dParts.push(`花费 ${costStr}`);
        if(giveStr) dParts.push(`消耗 ${giveStr}`);
        if(getStr)  dParts.push(`获得 ${getStr}`);
        // 库存检查 + 显示对比（避免浪费交易机会）
        const shortages = [];
        let enabled = true;
        if(g.cost && G.gold < g.cost){ enabled=false; shortages.push(`💰${G.gold}/${g.cost}`); }
        for(const k in (g.give||{})){
          const have = G.res[k]||0, need = g.give[k];
          if(have < need){ enabled=false; shortages.push(`${RES_NAMES[k]||k} ${have}/${need}`); }
        }
        const stockInfo = shortages.length ? `<br><span style="color:var(--bad);font-weight:700">❌ 库存不够（${shortages.join('、')}）</span>` : `<br><span style="color:var(--good);opacity:.85">✅ 可交易</span>`;
        const tag = ({'公平':'🟢','稀有':'🟣','神秘':'🔵','现金':'🟡','黑心':'🔴'})[g.tag] || '⚪';
        return {
          label: `${tag} ${g.label}`,
          d: `${g.blurb}<br><span style="opacity:.75">${dParts.join(' · ')}</span>${stockInfo}`,
          disabled: !enabled,
          // 修复 v1.27.6：箭头函数参数用 _g 而非 g，避免遮蔽外层 goods.map(g=>...) 的 g
          // resolveEvent(i) 调用 o.eff(G) 时参数为全局 G，外层商品对象要从闭包变量 g 取
          eff: g.eff || (g.cost
            ? (_g=>{ if(G.gold < g.cost){ log('💰 你掏了掏口袋，发现钱不够。','warn'); return; } G.gold -= g.cost; trade({}, g.get); })
            : (_g=>trade(g.give, g.get))),
        };
      }).concat([{label:'不换', d:'商人收起小车离开。', eff:()=>log('你婉拒了商人。','info')}]),
    });
    return;
  }
  // 猫耳机器人（废墟 NPC）：好感度 + 万能口袋
  if(raw._kind === 'dora'){
    const dora=doraInfo();
    // 亚空间厨具（v1.29.6）：生食/生水 > 500 时 15% 概率自动触发
    let extraNote='';
    if((G.res.food||0) > 500 && Math.random() < 0.15){
      const n=G.res.food||0;
      const out=Math.round(n*1.5);
      G.res.food=0;
      addRes('cooked', out);
      log(`🎛 猫耳机器人掏出一个方盒子——「亚空间烤炉！」${RES_NAMES.food} ×${n} 瞬间全部烤成 ${RES_NAMES.cooked} ×${out}！`,'good');
      extraNote += '🎛 亚空间烤炉已启动！';
    }
    if((G.res.water||0) > 500 && Math.random() < 0.15){
      const n=G.res.water||0;
      G.res.water=0;
      addRes('clean', n);
      log(`💧 「次世代净水机！」${RES_NAMES.water} ×${n} 全部净化成 ${RES_NAMES.clean} ×${n}！`,'good');
      extraNote += '💧 次世代净水机已启动！';
    }
    window._doraExtraNote = extraNote;
    showEvent({
      ...raw,
      text: `${raw.text}<br><span style="color:var(--accent)">🤖 好感度：${dora.name}（${dora.fav}${dora.nextNeed>0?` / 下一级还需 ${dora.nextNeed}`:''}）</span>${extraNote?`<br><span style="color:var(--good);font-weight:700">${extraNote}</span>`:''}`,
      opts: doraMainOpts(),
    });
    return;
  }
  // 迷路（v1.30.2）：选项动态生成（丢硬币需金币禁用检查）
  if(raw.id==='lost'){
    showEvent({...raw, opts: lostOpts()});
    return;
  }
  showEvent(raw);
}
/* 猫耳机器人二级菜单（v1.29.7）：主菜单 → 送礼/口袋/闲聊/离开 */
function doraMainOpts(){
  return [
    {label:'🤝 送礼（4 种礼物）', d:'选个礼物提升好感度', eff:()=>{
      showEvent({title:'🤖 送礼', text:'选个礼物送给猫耳机器人：', opts: doraGiftOpts()});

      showEvent({title:'🎒 万能口袋', text:doraInfo().max?'它把整个口袋翻给你看！':'当前好感度可购买的物品：', opts: doraPocketOpts()});
    }},

    }},
    {label:'👋 离开', d:'下次再来找它', eff:()=>{}},

}
function doraGiftOpts(){
  const dora=doraInfo();
  const gifts=[
    {label:'🤝 送 🔩金属×5', need:{metal:5}, fav:8,  blurb:'它接过金属零件，眼睛亮了一下'},
    {label:'🤝 送 ⚙️合金×2', need:{alloy:2}, fav:15, blurb:'它爱不释手地摆弄着合金'},
    {label:'🤝 送 🔮符石×1', need:{rune:1},  fav:25, blurb:'它小心翼翼地收进口袋最深处'},
    {label:'🤝 送 🍖食物×10', need:{food:10}, fav:5,  blurb:'它说这味道让它想起前辈的铜锣烧'},
  ];
  const opts = gifts.map(gt=>{
    const can=Object.keys(gt.need).every(c=>(G.res[c]||0)>=gt.need[c]);
    return {
      label: gt.label,
      d: `${gt.blurb}<br><span style="opacity:.75">好感度 +${gt.fav}（当前 ${dora.fav}）</span>`,
      disabled: !can,
      eff: ()=>{ for(const k in gt.need) spend(k,gt.need[k]); addDoraFav(gt.fav); log(`🤖 猫耳机器人收下了礼物，好感度 +${gt.fav}。`,'good'); },
    };
  });
  opts.push({label:'⬆ 返回上级', d:'回到主菜单', eff:()=>{
    const d=doraInfo();
    showEvent({title:'🤖 猫耳机器人', text:`<span style="color:var(--accent)">🤖 好感度：${d.name}（${d.fav}${d.nextNeed>0?` / 下一级还需 ${d.nextNeed}`:''}）</span>${window._doraExtraNote?`<br><span style="color:var(--good);font-weight:700">${window._doraExtraNote}</span>`:''}`, opts: doraMainOpts()});
  }});
  return opts;
}
function doraPocketOpts(){
  const opts = doraGoods().map(gd=>{
    const can = gd.cost===0 || (G.gold||0)>=gd.cost;
    const giveOk = Object.keys(gd.give||{}).every(c=>(G.res[c]||0)>=gd.give[c]);
    const enabled = can && giveOk;
    let parts=[];
    if(gd.cost>0) parts.push(`💰${gd.cost}`);
    if(gd.give) Object.keys(gd.give).forEach(c=>parts.push(`${RES_NAMES[c]}×${gd.give[c]}`));
    const getTxt = gd.get ? Object.keys(gd.get).map(c=>`${RES_NAMES[c]}×${gd.get[c]}`).join('+') : '';
    return {
      label: `🎒 ${gd.name}`,
      d: `${gd.blurb}<br><span style="opacity:.75">${parts.join(' + ')}${parts.length?' → ':''}${getTxt||'神秘物品'}</span>`,
      disabled: !enabled,
      eff: ()=>{
        if(gd.cost>0){ if((G.gold||0)<gd.cost){ log('💰 你掏了掏口袋，发现钱不够。','warn'); return; } G.gold-=gd.cost; }
        for(const k in (gd.give||{})) if(!spend(k,gd.give[k])){ log(`材料不足（${RES_NAMES[k]}）`,'warn'); return; }
        if(gd.eff){ gd.eff(G); }
        else if(gd.get){ for(const k in gd.get) addRes(k,gd.get[k]); log(`🤖 猫耳机器人从口袋里掏出：${getTxt}！`,'good'); }
        addDoraFav(1);
      },
    };
  });
  if(!opts.length){
    opts.push({label:'（暂无商品）', d:'好感度不足', disabled:true, eff:()=>{}});
  }
  opts.push({label:'⬆ 返回上级', d:'回到主菜单', eff:()=>{
    const d=doraInfo();
    showEvent({title:'🤖 猫耳机器人', text:`<span style="color:var(--accent)">🤖 好感度：${d.name}（${d.fav}${d.nextNeed>0?` / 下一级还需 ${d.nextNeed}`:''}）</span>${window._doraExtraNote?`<br><span style="color:var(--good);font-weight:700">${window._doraExtraNote}</span>`:''}`, opts: doraMainOpts()});
  }});
  return opts;
}
function rollNightEvent(){
  // 金币小偷：余额 >1 万时 10% 概率被偷光（人人平等，无防御）
  if((G.gold||0) > 10000 && Math.random()<0.10){
    const lost=(G.gold||0)-1;
    G.gold=1;
    log(`🌙 你惊醒过来——钱袋空空如也！只留下 1 枚金币和一张字条：「看你可怜，给你留 1 元。」（💰被偷走 ${lost}）`,'bad');
    checkMilestone('robbed1'); // 破财消灾成就
    renderAll(); save();
  }
  // 月圆之夜：狼群躁动，70% 概率触发专属事件（绕过普通 0.35 判定）
  if(isFullMoon()){
    if(Math.random()<0.7){ showMoonNightEvent(); return; }
    log('🌕 满月当空，远处狼嚎此起彼伏，但今晚它们没敢靠近营地。','info');
  }
  if(Math.random()<0.35) return;
  // 废土兽王（夜间遭遇；击败后可再遇）
  const bk=G.stats.bossKills||0;
  if(G.day>=30 && Math.random()<(bk>0?0.03:0.05) && (bk===0 || G.day>=45+G.stats.bossFirstAt)){ startBossFight(true); return; }
  const pool=[];
  NIGHT_EVENTS.forEach(e=>{ for(let i=0;i<e.w;i++) pool.push(e) });
  const ev = pool[Math.floor(Math.random()*pool.length)];
  if(ev.fight){ startCombat(0.5, true); return; }
  if(ev.cold){
    if(G.season===3 && !has('fire')){
      G.hp=clamp(G.hp-8,0,100); log('寒夜无火，你冻得几乎失去知觉……','bad');
    } else if(G.season===3){
      log('火堆噼啪作响，驱散了夜的寒意。','good');
    } else {
      log('夜里起了凉风，好在你裹紧了外套。','sys');
    }
    return;
  }
  if(ev.steal){
    const keys=Object.keys(G.res).filter(k=>G.res[k]>0);
    if(keys.length){
      const k=keys[Math.floor(Math.random()*keys.length)];
      const n=Math.min(G.res[k], rnd(1,3));
      G.res[k]-=n;
      log(`夜色中你丢了 ${RES_NAMES[k]} ×${n}……`,'bad');
    }
    return;
  }
  if(ev.heal){ G.hp=clamp(G.hp+ev.heal,0,100); log('一夜好眠，生命 +'+ev.heal+'。','good'); }
}
