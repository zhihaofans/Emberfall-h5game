/* 事件弹窗 */
function showEvent(ev){
  pendingEvent=ev;
  G.stats.events++;
  const w=document.getElementById('evwrap');
  let h=`<h4>⚡ ${ev.title}</h4><div class="evbox"><div class="evt">${ev.text}</div>`;
  ev.opts.forEach((o,i)=>{
    const dis = o.disabled ? 'disabled style="opacity:.45;cursor:not-allowed"' : '';
    h+=`<button class="evbtn" ${dis} onclick="resolveEvent(${i})">${o.label}<span class="d">${o.d}</span></button>`;
  });
  h+=`</div>`;
  w.innerHTML=h;
  document.getElementById('evmask').classList.add('show');
  renderAll(); save();
}
function resolveEvent(i){
  document.getElementById('evmask').classList.remove('show');
  const ev=pendingEvent; pendingEvent=null;
  if(!ev) return;
  const o=ev.opts[i];
  if(o.disabled){ log('❌ 库存不足，无法交易（不消耗机会）。','warn'); return; }
  log(`【${ev.title}】${o.label}`,'ev');
  o.eff(G);
  renderAll(); save();
  checkDeath();
}

/* ---------------- 战斗 ---------------- */
let combat=null;
function startCombat(tierScale, night, forceBeasts){
  // 45% 概率遇到当前区域的专属生物（森林野人/废墟机器人/河边鳄鱼/山丘巨鹰）；forceBeasts 强制野兽池（月圆狼群）
  const zonePool = REGION_BEASTS[curZone];
  const pool = (!forceBeasts && zonePool && Math.random()<0.45) ? zonePool : BEASTS;
  let idx;
  if(tierScale===1){ idx = Math.min(pool.length-1, Math.random()<.5?0:1); }
  else if(tierScale===0.5){ idx = Math.min(pool.length-1, Math.random()<.6?0:1); }
  else { idx=Math.min(pool.length-1, Math.floor(Math.random()*pool.length)); }
  let b=pool[idx];
  // 月圆之夜：野狗/灰狼进化为强化形态
  if(isFullMoon() && b.name==='野狗') b=Object.assign({}, b, MOON_BEASTS.dog);
  else if(isFullMoon() && b.name==='灰狼') b=Object.assign({}, b, MOON_BEASTS.wolf);
  combat={b:b, scale:tierScale};
  // 图鉴解锁：遭遇即解锁（v1.30.0）
  if(pool===BEASTS) wikiSeen('beast'+idx);
  else if(pool===ROBOTS) wikiSeen('rob'+idx);
  else if(pool===REGION_BEASTS.forest) wikiSeen('zone-forest');
  else if(pool===REGION_BEASTS.river) wikiSeen('zone-river');
  else if(pool===REGION_BEASTS.hills) wikiSeen('zone-hills');
  else if(pool===REGION_BEASTS.pyramid) wikiSeen('pyr'+idx);
  if(b.name.includes('凶犬')) wikiSeen('moon-dog');
  else if(b.name.includes('月狼')) wikiSeen('moon-wolf');
  const w=document.getElementById('evwrap');
  const wpn=weaponAtk();
  const isMoonBeast = isFullMoon() && (b.name.includes('凶犬')||b.name.includes('月狼'));
  const envTxt = pool===ROBOTS ? '废土残骸堆中亮起一对猩红的传感器——'
               : isMoonBeast ? '月光下，一双血红的眼睛在黑暗中亮起——'
               : (night?'夜幕中':'草丛中');
  let h=`<h4>⚔️ 遭遇 ${b.name}！${isMoonBeast?'<span style="color:var(--warn)">（月圆进化）</span>':''}</h4><div class="evbox"><div class="evt">${envTxt}，${b.name}盯上了你。${wpn.name!=='徒手'?'你握紧'+wpn.name+'。':'你手无寸铁！'}</div>`;
  h+=`<button class="evbtn" onclick="fight('fight')">迎战<span class="d">${wpn.name}伤害 ${wpn.atk}</span></button>`;
  h+=`<button class="evbtn" onclick="fight('flee')">逃跑<span class="d">消耗精力 · 有风险</span></button>`;
  if(G.res.food>0) h+=`<button class="evbtn" onclick="fight('bait')">扔食物引开<span class="d">生食 -2</span></button>`;
  h+=`</div>`;
  w.innerHTML=h;
  document.getElementById('evmask').classList.add('show');
  save();
}
function fight(act){
  const isBoss=combat.isBoss;
  const b=combat.b; combat=null;
  document.getElementById('evmask').classList.remove('show');
  const wpn=weaponAtk();
  if(act==='fight'){
    const lv=skillLvl('combat');
    if(isBoss){
      // Boss 战：多回合自动对拼，直到一方倒下
      let rounds=0;
      while(b.hp>0 && G.hp>0){
        rounds++;
        const dmg=Math.round(wpn.atk*(1+(G.upgrades.weapon||0)*0.1)*(1+lv*0.05)*(0.8+Math.random()*0.4));
        const takenRaw=Math.round(b.atk*(0.6+Math.random()*0.6));
        const taken = Math.max(1, Math.round(takenRaw * armorDmgMult()));
        b.hp-=dmg;
        G.hp=clamp(G.hp-taken,0,100);
        log(`⚔️ 第${rounds}回合：你造成 ${dmg} 点伤害，兽王反击 ${taken} 点。`,'ev');
      }
      addXp('combat', rnd(30,45));
      if(b.hp<=0){
        G.stats.kills++;
        if(combat.isPharaoh){
          // 🏜 金字塔法老（更丰厚的奖励）
          const ps=pharaohStats();
          G.gold += ps.gold;
          addRes('food',ps.food); addRes('leather',ps.leather);
          addRes('metal',ps.metal); addRes('alloy',ps.alloy); addRes('rune',ps.rune);
          addRes('luck',1); addRes('goldOre',rnd(2,4));
          // 法老额外概率掉落：不死图腾 50%、肾上腺素 50%、符刃图纸 30%（仅首次）
          let extra='';
          if(Math.random()<0.5){ addRes('totem',1); extra+='、🪬不死图腾 ×1'; }
          if(Math.random()<0.5){ addRes('adrenaline',1); extra+='、💉肾上腺素 ×1'; }
          log(`🏆 ${ps.name}轰然倒地！沙金碎了一地！你获得了${RES_NAMES.food} ×${ps.food}、${RES_NAMES.leather} ×${ps.leather}、${RES_NAMES.metal} ×${ps.metal}、${RES_NAMES.alloy} ×${ps.alloy}、${RES_NAMES.rune} ×${ps.rune}、${RES_NAMES.goldOre} ×2~4、💰${ps.gold}${extra}！`,'good');
          G.stats.pharaohKills=(G.stats.pharaohKills||0)+1;
          if(!G.stats.pharaohFirstAt) G.stats.pharaohFirstAt=G.day;
          checkMilestone('pharaoh1');
          if(G.stats.pharaohKills>=2) checkMilestone('pharaoh2');
          if(G.stats.pharaohKills>=3) checkMilestone('pharaoh3');
        } else {
          // 🐾 废土兽王
          const bs=bossStats();
          addRes('food',bs.food); addRes('leather',bs.leather); addRes('metal',bs.metal);
          addRes('luck',1);
          addRes('rune',1);
          // 兽王 40% 概率掉落不死图腾（稀有消耗品）+ 30% 掉肾上腺素
          let totemTxt='';
          if(Math.random()<0.4){ addRes('totem',1); totemTxt='、🪬不死图腾 ×1'; }
          if(Math.random()<0.3){ addRes('adrenaline',1); totemTxt+='、💉肾上腺素 ×1'; }
          log(`🏆 ${bs.name}轰然倒地！你获得了${RES_NAMES.food} ×${bs.food}、${RES_NAMES.leather} ×${bs.leather}、${RES_NAMES.metal} ×${bs.metal}、${RES_NAMES.luck} ×1、${RES_NAMES.rune} ×1${totemTxt}！`,'good');
          G.stats.bossKills=(G.stats.bossKills||0)+1;
          if(!G.stats.bossFirstAt) G.stats.bossFirstAt=G.day;
          checkMilestone('boss');
          if(G.stats.bossKills>=2) checkMilestone('boss2');
          if(G.stats.bossKills>=3) checkMilestone('boss3');
        }
        log(`🩸 你已击败兽王 ${G.stats.bossKills} 次，它的躯体会再次凝聚……`,'info');
      } else {
        log('你倒在了兽王的利爪下……','bad');
      }
      renderAll(); save(); checkDeath();
      return;
    }
    const dmg=Math.round(wpn.atk*(1+(G.upgrades.weapon||0)*0.1)*(1+lv*0.05)*(0.8+Math.random()*0.4));
    const takenRaw=Math.round(b.atk*(0.6+Math.random()*0.6));
    const taken = Math.max(1, Math.round(takenRaw * armorDmgMult()));
    b.hp-=dmg;
    G.hp=clamp(G.hp-taken,0,100);
    addXp('combat', rnd(10,16));
    log(`⚔️ 你挥出${wpn.name}造成 ${dmg} 点伤害，被反击 ${taken} 点。`,'ev');
    if(b.hp<=0){
      G.stats.kills++;
      // 通用掉落（野兽掉食物/皮革，机器人掉金属/合金，金字塔怪物掉符石）
      const loot=[];
      const lootDef={food:'food', leather:'leather', metal:'metal', alloy:'alloy', rune:'rune'};
      for(const k in lootDef){
        const v=b[lootDef[k]];
        if(v>0){ addRes(lootDef[k],v); loot.push(`${RES_NAMES[lootDef[k]]} ×${v}`); }
      }
      log(`🏆 你击败了${b.name}！获得 ${loot.join('、')}`,'good');
      checkMilestone('kill1');
      checkStageAchieve();
      if(b.name && b.name.includes('木乃伊')) checkMilestone('mummy1'); // 木乃伊杀手成就
    } else {
      log(`${b.name}还在挣扎，你趁机撤退了。`,'warn');
      G.hp=clamp(G.hp-6,0,100);
      if(G.hp<40&&!G.heavyWound){G.heavyWound=true; log('你受了重伤，行动力大减。','bad')}
    }
  } else if(act==='flee'){
    const ok=Math.random()<0.55;
    G.stam=clamp(G.stam-12,0,100);
    if(ok){ log('你连滚带爬逃出了追击。','sys') }
    else{ G.hp=clamp(G.hp-b.atk,0,100); log(`你没能甩掉${b.name}，被抓伤！`,'bad'); }
  } else if(act==='bossflee'){
    G.stam=clamp(G.stam-15,0,100);
    if(Math.random()<0.8){ log('你屏息凝神，趁兽王转身时悄悄退走了。','sys'); }
    else{ G.hp=clamp(G.hp-22,0,100); log('兽王发现了你，一爪拍来！你重伤倒地，侥幸逃脱。','bad'); G.heavyWound=true; }
  } else if(act==='bait'){
    if(spend('food',2)){
      if(Math.random()<0.7){ log('你把食物丢出去，趁它进食时溜走了。','good') }
      else{ G.hp=clamp(G.hp-b.atk,0,100); log(`${b.name}吃完了食物却还是追上来咬了你！`,'bad') }
    }
  }
  renderAll(); save(); checkDeath();
}

/* ---------------- 技能 ---------------- */
function skillLvl(k){ return G.skills[k]? G.skills[k].lvl : 1 }
function addXp(k, n){
  if(!(k in G.skills)) return;
  const s=G.skills[k];
  s.xp+=n;
  while(s.xp>=xpNeed(s.lvl) && s.lvl<50){
    s.xp-=xpNeed(s.lvl); s.lvl++;
    log(`⬆ ${SKILL_NAMES[k]} 升到 Lv.${s.lvl}！${SKILL_DESC[k]}`,'good');
  }
}

/* ---------------- 行动 ---------------- */
function doAction(kind){
  if(G.dead) return;
  const a=ACTIONS[kind];
  if(!a) return;
  // 手动决策类动作（探索/睡觉/治疗）会打断自动放置
  if(!a.auto && kind!=='eat' && kind!=='drink') stopAuto(true);
  // 前置检查（失败时停止自动放置）
  if(kind==='hunt' && !G.items.knife && !G.items.iron && !G.items.steel && !G.items.huntKing){ stopAuto(); toast('需要先制作石刀/铁刀/钢刀'); return }
  if(kind==='fish' && !G.items.rod){ stopAuto(); toast('需要先制作鱼竿'); return }
  if(kind==='smelt' && !G.items.forge){ stopAuto(); toast('需要先制作铁匠炉'); return }
  if(kind==='smeltOre' && !G.items.forge){ stopAuto(); toast('需要先制作铁匠炉'); return }
  if(kind==='cook' && (!G.items.fire || G.offToday.fire)){ stopAuto(); toast(G.offToday.fire?'火堆今天停摆了，需要木材维护':'需要先制作火堆'); return }
  if(kind==='boil' && (!G.items.fire || G.offToday.fire)){ stopAuto(); toast(G.offToday.fire?'火堆今天停摆了，需要木材维护':'需要先制作火堆'); return }
  // 材料前置检查（v1.29.4）：材料不足时直接 return，避免扣精力/推进时间
  if(kind==='cook' && (G.res.food||0)<=0){ stopAuto(); toast('没有生食可以烹饪'); return }
  if(kind==='boil' && (G.res.water||0)<=0){ stopAuto(); toast('没有生水可以烧'); return }
  if(kind==='smelt' && (G.res.metal||0)<=0){ stopAuto(); toast('没有金属可以熔炼'); return }
  if(kind==='smelt' && (G.res.stone||0)<2){ stopAuto(); toast('石头不够熔炼（至少需要 2）'); return }
  if(kind==='smeltOre' && !(G.res.goldOre||0) && !(G.res.silverOre||0) && !(G.res.copperOre||0)){ stopAuto(); toast('没有矿石可冶炼（采矿可得铜/银/金矿石）'); return }
  if(kind==='heal' && G.hp>=100){ toast('生命值已满，无需治疗'); return }
  if(kind==='heal' && (G.res.herb||0)<=0){ toast('没有草药'); return }
  if(a.stam>0 && G.stam < a.stam){ stopAuto(); toast('精力不足，先睡一觉吧'); return }
  if(a.time>0 && G.hour + a.time > 24 && (G.food<12||G.water<15)){ stopAuto(); toast('天色已晚且你饥渴难耐，先吃饭喝水'); return }

  // 肾上腺素期间：精力不消耗
  if(!isAdrenaline()) G.stam=clamp(G.stam-a.stam,0,100);
  if(a.time>0) log(`▸ ${a.name}……`,'info');
  G.stats.explore += (kind==='explore')?1:0;
  if(a.skill) addXp(a.skill, rnd(4,8));
  if(kind==='explore') checkStageAchieve(); // 探索次数成就
  if(kind==='explore' && curZone){ G.stats.zoneCnt[curZone]=(G.stats.zoneCnt[curZone]||0)+1; checkZoneAchieve(); } // 区域探索成就

  switch(kind){
    case 'explore': doExplore(); break;
    case 'chop':{
      const lv=skillLvl('chop');
      const up=1+(G.upgrades.axe||0)*0.1;
      const eff=1+((G.enchant&&G.enchant.tool)||0)*0.08; // ⚒ 效率附魔
      const base=G.items.ironAxe?8:(G.items.axe?5:3); // v1.29.2 基础砍柴产出 -15%
      const n=Math.round(rnd(base, base+(G.items.ironAxe?6:(G.items.axe?4:2)))*(1+lv*0.08)*up*eff);
      addRes('wood',n); log(`获得${RES_NAMES.wood} ×${n}。`,'good');
      break;
    }
    case 'hunt':{
      const lv=skillLvl('hunt');
      const mult=G.items.iron?1.8:(G.items.knife?1.3:0.8);
      if(Math.random()<0.55*mult*(1+lv*0.04)){
        const n=rnd(6,12); addRes('food',n); log(`狩猎成功！获得${RES_NAMES.food} ×${n}。`,'good'); // v1.29.2 食物 8-15→6-12
        G.stats.hunt++;
      } else {
        log('猎物跑掉了，白忙一场。','warn');
        if(Math.random()<0.3){ G.hp=clamp(G.hp-8,0,100); log('追赶时扭伤了脚踝。','bad'); }
      }
      break;
    }
    case 'fish':{
      // 参考 Minecraft 钓鱼：鱼（普通）/ 垃圾（常见）/ 宝藏（稀有）三档战利品表
      const lv=skillLvl('fish');
      const up=G.upgrades.rod||0;
      if(Math.random()>=0.7+lv*0.012+up*0.06){ log('水面平静，鱼不咬钩。','warn'); break }
      // —— 低概率钓到怪物（触发战斗）——
      if(Math.random() < 0.035){
        stopAuto();
        G.stats.fish = (G.stats.fish||0) + 1;
        addXp('fish', rnd(8,15));
        log('🎣 鱼线猛地绷紧——你钓上来一只张牙舞爪的怪物！','bad');
        startCombat(1);
        break;
      }
      const junkChance = Math.max(0.10, 0.42 - lv*0.003 - up*0.010);   // 等级/强化降低垃圾率
      const treasChance = Math.min(0.32, 0.13 + lv*0.002 + up*0.012);  // 等级/强化提升宝藏率
      const roll=Math.random();
      if(roll < treasChance){
        // ── 宝藏池 ──
        G.stats.fishTreas = (G.stats.fishTreas||0) + 1;
        addXp('fish', rnd(10,18)); // 宝藏额外渔猎经验
        const TREASURES=[
          {w:3, txt:'🪙 钓上一个沉甸甸的钱袋！', eff:()=>{ const g=rnd(20,45); G.gold+=g; log(`💰 金币 +${g}。`,'good') }},
          {w:2, txt:'📦 捞出个生锈铁箱！',       eff:()=>{ addRes('metal',rnd(4,7)); addRes('alloy',rnd(1,3)); log(`${RES_NAMES.metal}+4~7 ${RES_NAMES.alloy}+1~3`,'good') }},
          {w:1, txt:'🎲 一个湿漉漉的幸运方块！', eff:()=>{ addRes('luck',1); log(`${RES_NAMES.luck} ×1`,'good') }},
          {w:1, txt:'🔮 符石！居然被鱼叼着！',   eff:()=>{ addRes('rune',1); log(`${RES_NAMES.rune} ×1`,'good'); checkFishAchieve('rune'); return; }},
          {w:2, txt:'🚰 密封水壶完好无损！',     eff:()=>{ addRes('clean',rnd(6,10)); log(`${RES_NAMES.clean}+6~10`,'good') }},
          {w:1, txt:'📜 湿透的图纸……还能看懂！',eff:()=>{
            const unowned=Object.keys(RECIPES).filter(k=>!G.items[k]);
            if(unowned.length){ const pick=unowned[Math.floor(Math.random()*unowned.length)]; G.items[pick]=true; log(`你学会了 ${RECIPES[pick].name} 的制作方法！`,'good'); }
            else log('图纸已经看不清了。','warn');
            checkFishAchieve('blueprint');
          }},
        ];
        const pool=[]; TREASURES.forEach(t=>{ for(let i=0;i<t.w;i++) pool.push(t) });
        const t=pool[Math.floor(Math.random()*pool.length)];
        log(t.txt,'good'); t.eff();
        checkFishAchieve('treasure');
      } else if(roll < junkChance + treasChance){
        // ── 垃圾池 ──
        const JUNK=[
          {w:3, txt:'🥾 一只破皮靴，也许是上个时代的。', eff:()=>{ addRes('leather',1); log(`${RES_NAMES.leather} ×1`,'info') }},
          {w:3, txt:'🪨 河卵石，至少有点分量。',         eff:()=>{ addRes('stone',rnd(2,4)); log(`${RES_NAMES.stone}+2~4`,'info') }},
          {w:3, txt:'🪵 漂在水里的浮木。',               eff:()=>{ addRes('wood',rnd(2,4)); log(`${RES_NAMES.wood}+2~4`,'info') }},
          {w:2, txt:'🦴 鱼骨，勉强能啃一啃。',           eff:()=>{ addRes('food',rnd(1,3)); log(`${RES_NAMES.food}+1~3`,'info') }},
          {w:2, txt:'🔩 生锈的铁钩子。',                 eff:()=>{ addRes('metal',1); log(`${RES_NAMES.metal} ×1`,'info') }},
          {w:1, txt:'🌿 一团水草，泡得发烂。',           eff:()=>{ addRes('herb',1); log(`${RES_NAMES.herb} ×1`,'info') }},
          {w:2, txt:'🧴 空瓶子，瓶塞还带着霉味。',       eff:()=>{} },
        ];
        const pool=[]; JUNK.forEach(j=>{ for(let i=0;i<j.w;i++) pool.push(j) });
        const j=pool[Math.floor(Math.random()*pool.length)];
        log(j.txt,'info'); j.eff();
        // 10% 概率垃圾里翻出零钱
        if(Math.random()<0.10){ const c=rnd(1,5); G.gold+=c; log(`💰 垃圾里翻出 ${c} 枚硬币。`,'good'); }
      } else {
        // ── 鱼类 ──
        G.stats.fish = (G.stats.fish||0) + 1;
        addXp('fish', rnd(6,12)); // 钓鱼成功额外渔猎经验
        if(Math.random()<0.12){
          // 大鱼
          G.stats.fishBig = (G.stats.fishBig||0) + 1;
          addXp('fish', rnd(15,25));
          const n=rnd(12,18); addRes('food',n);
          log(`🐟 上钩一条罕见的大鱼！${RES_NAMES.food} ×${n}。`,'good');
          checkFishAchieve('big');
        } else {
          const n=rnd(5,11); addRes('food',n);
          log(`🐟 钓上一条鱼！${RES_NAMES.food} ×${n}。`,'good');
        }
        // 15% 概率鱼嘴里叼着钱
        if(Math.random()<0.15){ const c=rnd(1,8); G.gold+=c; log(`💰 鱼嘴里叼着一枚硬币！金币 +${c}。`,'good'); }
        checkFishAchieve();
      }
      break;
    }
    case 'smelt':{
      const n=Math.min(G.res.metal||0, rnd(1,2));
      if(n<=0){ log('没有金属可以熔炼。','warn'); break }
      const needStone=n*2;
      if((G.res.stone||0)<needStone){ log('石头不够熔炼（需要 '+needStone+'）。','warn'); break }
      spend('metal',n); spend('stone',needStone); addRes('alloy',n);
      log(`铁匠炉熔炼出${RES_NAMES.alloy} ×${n}（${RES_NAMES.metal} ${n} + ${RES_NAMES.stone} ${needStone}）。`,'good');
      break;
    }
    case 'mineOre':{
      // 采矿：石头保底 + 概率出矿石（铜多、银少、金稀有）
      const lv=skillLvl('mine');
      const eff=1+((G.enchant&&G.enchant.tool)||0)*0.08;
      const st=Math.round(rnd(1,2)*(1+lv*0.05)*eff); // v1.29.2 石头 -33%（1-3 → 1-2）
      addRes('stone',st);
      let got=[`${RES_NAMES.stone} ×${st}`];
      const r=Math.random();
      if(r<0.03){ addRes('goldOre',1); got.push(`${RES_NAMES.goldOre} ×1`); checkMilestone('oreGold'); }
      else if(r<0.15){ addRes('silverOre',1); got.push(`${RES_NAMES.silverOre} ×1`); checkMilestone('oreSilver'); }
      else if(r<0.45){ addRes('copperOre',1); got.push(`${RES_NAMES.copperOre} ×1`); checkMilestone('oreCopper'); }
      G.stats.ores=(G.stats.ores||0)+1;
      log(`⛏ 挖到 ${got.join('、')}。`,'good');
      break;
    }
    case 'smeltOre':{
      // 炼锭：矿石 → 锭（优先金、银、铜）
      if(!G.items.forge){ log('需要先制作铁匠炉。','warn'); break }
      let done=false;
      const ores=[['goldOre','gold'],['silverOre','silver'],['copperOre','copper']];
      for(const [ore,ingot] of ores){
        if((G.res[ore]||0)>0){
          spend(ore,1); addRes(ingot,1);
          G.stats.ingots=(G.stats.ingots||0)+1;
          checkMilestone('smelt1');
          if((G.res.gold||0)>=1 && (G.res.silver||0)>=1 && (G.res.copper||0)>=1) checkMilestone('ingotAll');
          log(`🔥 ${RES_NAMES[ore]} ×1 炼成了 ${RES_NAMES[ingot]} ×1。`,'good');
          done=true; break;
        }
      }
      if(!done) log('没有可冶炼的矿石（采矿可得铜/银/金矿石）。','warn');
      break;
    }
    case 'fetch':{
      const n=rnd(5,8); addRes('water',n); log(`获得${RES_NAMES.water} ×${n}（生水可能让你生病，建议烧开）。`,'good');
      if(has('puri')){ log('净水器自动净化了生水。','good'); }
      else if(Math.random()<0.22){ G.ill=true; log('你喝了生水，腹痛如绞……感染了疾病！','bad'); }
      break;
    }
    case 'cook':{
      const lv=skillLvl('cook');
      const n=Math.min(G.res.food||0, rnd(2,5));
      if(n<=0){ log('没有生食可以烹饪。','warn'); break }
      spend('food',n); const out=Math.round(n*1.5*(1+lv*0.10));
      addRes('cooked',out);
      log(`烹饪完成：${RES_NAMES.food} ×${n} → ${RES_NAMES.cooked} ×${out}（更顶饱）。`,'good');
      G.stats.cook++;
      checkStageAchieve(); // 烹饪次数成就
      break;
    }
    case 'boil':{
      const n=Math.min(G.res.water||0, rnd(3,6));
      if(n<=0){ log('没有生水可以烧。','warn'); break }
      spend('water',n); addRes('clean',n);
      log(`烧开${RES_NAMES.water} ×${n}，得到${RES_NAMES.clean} ×${n}。`,'good');
      break;
    }
    case 'eat':{
      if(G.food>=100){ toast('你已经吃饱了'); return; }
      let n=0, src=null, risk=0;
      if(G.res.cooked>0){ n=Math.min(G.res.cooked, rnd(1,2)); spend('cooked',n); src='熟食'; }
      else if(G.res.food>0){ n=Math.min(G.res.food, rnd(1,2)); spend('food',n); src='生食'; risk=0.15; }
      if(n<=0){ toast('没有食物可吃'); return }
      const gain=src==='熟食'? 16*n : 9*n;
      G.food=clamp(G.food+gain,0,100);
      log(`你吃下 ${src} ×${n}，饱食 +${gain}。`,'good');
      if(risk && Math.random()<risk){ G.ill=true; log('生食让你闹肚子……感染了疾病！','bad'); }
      break;
    }
    case 'drink':{
      if(G.water>=100){ toast('你已经喝足了'); return; }
      let n=0, src=null, risk=0;
      if(G.res.clean>0){ n=Math.min(G.res.clean, rnd(1,2)); spend('clean',n); src='净水'; }
      else if(G.res.water>0){ n=Math.min(G.res.water, rnd(1,2)); spend('water',n); src='生水'; risk=0.18; }
      if(n<=0){ toast('没有水可喝'); return }
      const gain=src==='净水'? 14*n : 8*n;
      G.water=clamp(G.water+gain,0,100);
      log(`你喝下 ${src} ×${n}，水分 +${gain}。`,'good');
      if(risk && Math.random()<risk){ G.ill=true; log('生水让你腹痛如绞……感染了疾病！','bad'); }
      break;
    }
    case 'sleep':{
      // 睡觉消耗食物与水：优先熟食/净水，都没有则睡不安稳只回 60% 精力
      let foodOk=true, waterOk=true;
      if(G.res.cooked>0){ spend('cooked',1); log('你吃了点熟食垫肚子。','good'); }
      else if(G.res.food>0){ spend('food',2); log('你啃了点生食。','warn'); }
      else foodOk=false;
      if(G.res.clean>0){ spend('clean',1); log('你喝了口水。','good'); }
      else if(G.res.water>0){ spend('water',2); log('你灌了点生水。','warn'); }
      else waterOk=false;
      if(!foodOk||!waterOk){
        log('你饿着肚子/口干舌燥，睡不安稳……','warn');
        G.stam=clamp(G.stam+60,0,100);
      } else {
        G.stam=100;
      }
      G.hp=clamp(G.hp+ (has('bed')?10:5),0,100);
      log(`你睡了 8 小时，精力恢复，生命 +${has('bed')?10:5}。`,'good');
      if(has('bed')) log('床铺让你睡得更安稳。','good');
      break;
    }
    case 'heal':{
      if(G.hp>=100){ toast('生命值已满，无需治疗'); return; }
      const n=Math.min(G.res.herb||0, rnd(2,4));
      if(n<=0){ toast('没有草药'); return }
      spend('herb',n);
      const mult=has('kit')?2:1;
      const hp=8*n*mult;
      G.hp=clamp(G.hp+hp,0,100);
      if(G.ill){ G.ill=false; log('你服下草药，病痛渐渐消退。','good') }
      if(G.heavyWound){ G.heavyWound=false; G.lightWound=true; log('重伤转为轻伤。','good') }
      else if(G.lightWound){ G.lightWound=false; log('伤口愈合了。','good') }
      log(`用${RES_NAMES.herb} ×${n} 治疗，生命 +${hp}。`,'good');
      break;
    }
  }
  if(a.time>0) passTime(a.time);
  renderAll(); save();
  checkDeath();
}

/* ---------------- 放置系统（Melvor 式自动循环） ---------------- */
function startAuto(kind){
  const a=ACTIONS[kind];
  if(!a || !a.auto){ return }
  G.autoAction=kind;
  log(`⏳ 开始自动${a.name}（可随时切换或停止）`,'sys');
  renderActive(); renderActions(); save();
  doAction(kind); // 立即执行一次，反馈更快
}
function stopAuto(silent){
  if(G.autoAction){
    G.autoAction=null;
    if(!silent) log('⏹ 停止自动行动。','sys');
  }
  renderActive(); renderActions();
}
function gameTick(){
  if(G.dead){ stopAuto(true); return }
  if(pendingEvent || combat){ return } // 有事件/战斗弹窗时暂停放置
  if(G.autoAction){
    const a=ACTIONS[G.autoAction];
    if(!a || !a.auto){ G.autoAction=null; renderActive(); return }
    doAction(G.autoAction);
  }
}
setInterval(gameTick, 1600);

function doExplore(){
  const z=ZONES[curZone];
  const lv=skillLvl('explore');
  // 区域资源
  let got=[];
  const rolls = G.items.axe?3:2;
  for(let i=0;i<rolls;i++){
    if(Math.random()<0.75){
      const pick=z.res[Math.floor(Math.random()*z.res.length)];
      let n=Math.round(rnd(pick[1],pick[2])*(1+lv*0.08));
      if(has('tower')) n=Math.round(n*1.5);        // 瞭望塔：探索收获 +50%
      if(has('forge') && pick[0]==='metal') n=Math.round(n*1.5); // 铁匠炉：金属加工 +50%
      if(has('forgeMast') && pick[0]==='metal') n=Math.round(n*1.5); // 大师炉：金属再 +50%（叠加）
      if(n>0){ addRes(pick[0],n); got.push(`${RES_NAMES[pick[0]]||pick[0]} ×${n}`); }
    }
  }
  if(got.length){ log(`在${z.name}搜刮到：${got.join('、')}。`,'good') }
  else { log(`在${z.name}转了一圈，一无所获。`,'warn') }
  // 天气惩罚
  if(G.weather===4){ log('暴风雪让探索异常艰难，精力额外消耗。','bad'); G.stam=clamp(G.stam-10,0,100); }
  else if(G.weather===3 && G.hour<18){ log('暴雨中你浑身湿透，行动迟缓。','warn'); G.stam=clamp(G.stam-6,0,100); }
  // 随机事件
  if(Math.random()<0.55) rollExploreEvent(z);
  // 幸运方块低概率掉率（探索奖励）
  if(Math.random()<0.03){ addRes('luck',1); log('🎁 探索中发现了一个幸运方块！','good'); }
  // 符石低概率掉率（废墟/山丘稀有）
  if((curZone==='ruins'||curZone==='hills') && Math.random()<0.05){ addRes('rune',1); log('🔮 你发现了一颗稀有的符石！','good'); }
}

/* 幸运方块使用 */
function useLuck(){
  if((G.res.luck||0)<1){ toast('没有幸运方块'); return }
  G.res.luck--;
  const pool=[];
  LUCK_EVENTS.forEach(e=>{ for(let i=0;i<e.w;i++) pool.push(e) });
  const ev=pool[Math.floor(Math.random()*pool.length)];
  log(`🎲 开启幸运方块：${ev.name}！`,'info');
  ev.eff(G);
  renderAll(); save();
  checkDeath();
}

/* ---------------- 制作 ---------------- */
function doCraft(id){
  const r=RECIPES[id];
  if(!r) return;
  if(G.items[id]){ toast('已经制作过了'); return }
  if(r.need && !G.items[r.need]){ toast('需要先制作'+RECIPES[r.need].name); return }
  // 基础技能门（v1.29.2）：基础配方需对应技能达到指定等级
  if(r.needLv && r.skill && skillLvl(r.skill) < r.needLv){
    toast(`需要 ${SKILL_NAMES[r.skill]||r.skill} Lv.${r.needLv} 才能制作（当前 Lv.${skillLvl(r.skill)}）`);
    return;
  }
  if(!hasRes(r.cost)){ toast('材料不足'); return }
  for(const k in r.cost) spend(k, r.cost[k]);
  G.items[id]=true;
  G.stats.craft++;
  log(`🔨 制作完成：${r.name}！${r.desc}`,'good');
  if(id==='fire') log('你点燃了火堆，这是夜晚的温暖与安全。','info');
  if(id==='ironAxe') log('铁斧在手，砍树如切豆腐。','info');
  if(id==='steel') log('钢刀寒光凛冽，野兽见了绕道走。','info');
  checkMilestone('craft1');
  checkStageAchieve(); // 制作次数成就
  // 全设施成就
  const allDone=Object.keys(RECIPES).every(k=>G.items[k]);
  if(allDone) checkMilestone('allcraft');
  passTime(r.time);
  renderAll(); save();
}

/* ---------------- 强化系统 ---------------- */
function upgradeItem(key){
  const u=UPGRADES[key]; if(!u) return;
  if(u.need && !G.items[u.need]){ toast('需要先制作'+RECIPES[u.need].name); return }
  const lv=G.upgrades[key]||0;
  const max=u.max||10;
  if(lv>=max){ toast('已达最高强化等级（Lv.'+max+'）'); return }
  const cost=upgradeCost(key, lv);
  if(!hasRes(cost)){ toast('材料不足'); return }
  for(const k in cost) spend(k,cost[k]);
  G.upgrades[key]=lv+1;
  G.stats.craft++;
  const costTxt=Object.keys(cost).map(k=>RES_NAMES[k]+'×'+cost[k]).join(' ');
  log(`⬆ ${u.name} → Lv.${lv+1}/${max}！${u.desc}（耗 ${costTxt}）`,'good');
  checkMilestone('up1');
  checkStageAchieve(); // 强化次数成就
  passTime(2);
  renderAll(); save();
}

const DAY_MILESTONES=[3,7,15,30,60,100,180];
const DAY_REWARDS={
  3:{}, // 新手期：纯庆祝
  7:{gold:30},
  15:{gold:60},
  30:{gold:100,food:30,water:30},
  60:{gold:200,food:80,water:80},
  100:{gold:500,food:200,water:200,metal:30,leather:20},
  180:{gold:1500,food:500,water:500,alloy:20},
};
function checkMilestone(key){
  if(typeof key==='number'){
    // 天数里程碑：当天 G.day 达到阈值时触发奖励
    [60,100,180].forEach(d=>{
      if(G.day>=d && !G.milestones['d'+d]){
        G.milestones['d'+d]=1;
        log(`🏆 里程碑：${MS[d]}！`,'good');
        const r=DAY_REWARDS[d];
        if(r){
          for(const k in r){ if(k==='gold') G.gold+=r[k]; else addRes(k,r[k]); }
          const parts=[];
          if(r.gold) parts.push(`💰${r.gold}`);
          for(const k in r){ if(k!=='gold') parts.push(`${RES_NAMES[k]||k} ×${r[k]}`); }
          log(`🎁 大事件奖励：${parts.join('、')}`,'info');
        }
      }
    });
    // 原 3/7/15/30 仍走原路径
    [3,7,15,30].forEach(d=>{
      if(G.day>=d && !G.milestones['d'+d]){ G.milestones['d'+d]=1; log(`🏆 里程碑：${MS[d]}！`,'good'); }
    });
    return;
  }
  if(['craft1','kill1','allcraft','boss','up1','fish1','fish10','fish50','fish100','fishBig','fishTreas','fishRune','fishBlueprint','fishLv10','fishLv25','fishLv50',
      'kill10','kill50','craft10','explore10','explore50','cook10','up5','up10','boss2','boss3','totem1','totem3','totem10',
      'armor1','armorIron','armorSteel','armorAll','oreCopper','oreSilver','oreGold','smelt1','ingotAll',
      'setLeather','setCopper','setIron','setSilver','setGold','setSteel','setsAll',
      'for1','for10','for50','rui1','rui10','rui50','riv1','riv10','riv50','hil1','hil10','hil50','pyr1','pyr10','pyr50',
      'mummy1','tomb1','goldroom1','pharaoh1','pharaoh2','pharaoh3','robbed1','goldEater','dora6'].includes(key)){
    if(!G.milestones[key]){ G.milestones[key]=1; log(`🏆 里程碑：${MS[key]}！`,'good'); }
  }
}

/* 通用阶段成就检查：累计次数达标即触发 */
function checkZoneAchieve(){
  const zc=G.stats.zoneCnt||{};
  for(const z in ZONES){
    const p=ZONES[z].ach; if(!p) continue;
    const n=zc[z]||0;
    if(n>=1) checkMilestone(p[0]);
    if(n>=10) checkMilestone(p[1]);
    if(n>=50) checkMilestone(p[2]);
  }
}
function checkStageAchieve(){
  if(G.stats.kills>=10) checkMilestone('kill10');
  if(G.stats.kills>=50) checkMilestone('kill50');
  if(G.stats.craft>=10) checkMilestone('craft10');
  if(G.stats.explore>=10) checkMilestone('explore10');
  if(G.stats.explore>=50) checkMilestone('explore50');
  if(G.stats.cook>=10) checkMilestone('cook10');
  const upTotal=Object.values(G.upgrades).reduce((s,v)=>s+v,0);
  if(upTotal>=5) checkMilestone('up5');
  if(upTotal>=10) checkMilestone('up10');
}

/* 钓鱼成就检查：按累计钓鱼次数 / 特殊事件触发 */
function checkFishAchieve(kind){
  if(kind==='treasure'){ checkMilestone('fishTreas'); return; }
  if(kind==='rune'){ checkMilestone('fishRune'); checkMilestone('fishTreas'); return; }
  if(kind==='blueprint'){ checkMilestone('fishBlueprint'); checkMilestone('fishTreas'); return; }
  if(kind==='big'){ checkMilestone('fishBig'); }
  const n=G.stats.fish||0;
  if(n>=1) checkMilestone('fish1');
  if(n>=10) checkMilestone('fish10');
  if(n>=50) checkMilestone('fish50');
  if(n>=100) checkMilestone('fish100');
  const lv=skillLvl('fish');
  if(lv>=10) checkMilestone('fishLv10');
  if(lv>=25) checkMilestone('fishLv25');
  if(lv>=50) checkMilestone('fishLv50');
}

function checkDeath(){
  if(G.dead) return;
  let reason=null;
  if(G.hp<=0) reason='你倒在了荒芜的大地上，再也没有起来。';
  else if(G.food<=0 && G.hp<30) reason='饥饿夺走了你最后的力气。';
  if(!reason) return;
  // 🪬 不死图腾：致命时刻自动消耗，从死亡边缘拉回（Minecraft 式免死一次）
  if((G.res.totem||0) > 0){
    G.res.totem--;
    G.hp=100; G.food=Math.max(G.food, 60); G.water=Math.max(G.water, 60);
    G.ill=false; G.lightWound=false; G.heavyWound=false;
    G.stam=Math.max(G.stam, 60);
    G.stats.totemSave=(G.stats.totemSave||0)+1;
    checkMilestone('totem1');
    if(G.stats.totemSave>=3) checkMilestone('totem3');
    if(G.stats.totemSave>=10) checkMilestone('totem10');
    log('🪬 不死图腾在你手中碎裂！金光笼罩全身——你从死亡边缘被拉了回来！','good');
    renderAll(); save();
    return;
  }
  G.dead=true; G.deathReason=reason;
  G.stats.days=G.day;
  stopAuto(true);
  save();
  showDeath();
}

/* ---------------- 存档：序列化 / 迁移 / 兜底 ---------------- */

/* 兜底：保证旧/脏存档的每个字段都存在，缺失补默认值，数值非法则修正。
   任何版本迁移后都必须经过它，防止 undefined 崩溃（坏档）。 */
function normalizeState(g){
  const defSkills={chop:{lvl:1,xp:0}, mine:{lvl:1,xp:0}, hunt:{lvl:1,xp:0}, fish:{lvl:1,xp:0}, explore:{lvl:1,xp:0}, cook:{lvl:1,xp:0}, combat:{lvl:1,xp:0}};
  const def={
    v:SAVE_FMT, day:1, hour:8, season:0, weather:0,
    hp:100, food:100, water:100, stam:100,
    ill:false, lightWound:false, heavyWound:false,
    res:{wood:4, stone:2, food:2, cooked:0, water:0, clean:2, herb:2, metal:0, leather:0, alloy:0, luck:0, rune:0, totem:0, copperOre:0, silverOre:0, goldOre:0, copper:0, silver:0, gold:0, adrenaline:0, expPotion:0, luckyDraw:0, lifePotion:0},
    items:{axe:false, knife:false, fire:false, puri:false, rod:false, trap:false, bed:false, kit:false, iron:false,
           ironAxe:false, steel:false, farm:false, tower:false, forge:false, huntKing:false, armorHead:'none', armorBody:'none', armorLegs:'none', armorBoots:'none',
           runeBlade:false, runeArmor:false, forgeMast:false, vault:false, autokitchen:false, solarBoiler:false, enchantTbl:false},
    upgrades:{weapon:0, axe:0, rod:0, trap:0},
    enchant:{tblLv:0, weapon:0, armor:0, tool:0},
    stats:{explore:0, hunt:0, craft:0, kills:0, cook:0, days:1, events:0, fish:0, fishTreas:0, fishBig:0, bossKills:0, bossFirstAt:0, pharaohKills:0, pharaohFirstAt:0, totemSave:0, ores:0, ingots:0, armorsWorn:[], zoneCnt:{}, ownedRes:{}},
    skills:defSkills, gold:0, lastSeen:Date.now(), autoAction:null, adrenalineLeft:0, offToday:{fire:false,puri:false,trap:false}, npcDora:{fav:0}, bestiary:{},
    milestones:{}, dead:false, deathReason:'',
  };
  if(!g || typeof g!=='object') g={};
  for(const k in def){
    if(!(k in g)) g[k]=def[k];
    else if(k==='res'||k==='items'||k==='stats'||k==='milestones'||k==='skills'){
      if(typeof g[k]!=='object'||!g[k]) g[k]=def[k];
      else for(const kk in def[k]){ if(!(kk in g[k])) g[k][kk]=def[k][kk]; }
    }
  }
  // skills 内部补齐 lvl/xp
  if(g.skills){ for(const s in defSkills){ if(!g.skills[s]) g.skills[s]={lvl:1,xp:0}; else { g.skills[s].lvl=Math.max(1, g.skills[s].lvl|0||1); g.skills[s].xp=Math.max(0, g.skills[s].xp|0||0); } } }
  // 区域探索计数兜底（新区域成就用）
  if(!g.stats || typeof g.stats!=='object') g.stats={};
  if(!g.stats.zoneCnt || typeof g.stats.zoneCnt!=='object') g.stats.zoneCnt={};
  if(!g.stats.ownedRes || typeof g.stats.ownedRes!=='object') g.stats.ownedRes={};
  if(!g.npcDora || typeof g.npcDora!=='object') g.npcDora={fav:0};
  if(!g.bestiary || typeof g.bestiary!=='object') g.bestiary={};
  // 数值修正
  g.day=Math.max(1, g.day|0||1); g.hour=((g.hour|0)%24+24)%24;
  g.season=Math.max(0,(g.season|0||0)); g.weather=Math.max(0,(g.weather|0||0));
  ['hp','food','water','stam'].forEach(k=>{ g[k]=clamp(g[k]|0||0, 0, 100) });
  // 金币 NaN 硬保护（修复 v1.16.x 出现的"购买符石后金币变 NaN"bug）
  if(typeof g.gold!=='number' || !isFinite(g.gold)) g.gold = 0;
  g.gold=Math.max(0, g.gold|0||0);
  // 一次性补偿：v1.17.1 修复 NaN 金币 bug，补偿 100 幸运方块（防新版本重复补偿）
  if(!g.__v1171_comp){
    g.__v1171_comp = 1;
    if(!g.res) g.res={};
    g.res.luck = (g.res.luck||0) + 100;
  }
  // 一次性补偿：v1.27.4 金币 NaN 修复，受影响玩家补 🪬不死图腾 ×1 + 🎰抽奖券 ×1
  if(!g.__v1274_comp){
    g.__v1274_comp = 1;
    if(!g.res) g.res={};
    g.res.totem = (g.res.totem||0) + 1;
    g.res.luckyDraw = (g.res.luckyDraw||0) + 2;
  }
  g.lastSeen = g.lastSeen|0 || Date.now();
  g.autoAction = null; // 载入后不恢复自动放置
  g.dead=!!g.dead;
  return g;
}

/* 存档格式迁移链：旧格式 → 最新格式。
   规则：每次改动存档结构，把 SAVE_FMT +1，并在此追加一段
   `if(fmt < N) { ...把旧数据改造成新结构... }`，旧存档即可无缝升级。 */
function migrateFrom(g, fmt){
  fmt = fmt|0 || 1;
  if(fmt < 2){
    // v1.x → v2：新增技能系统 / 金币 / 离线时间戳
    g.skills = {chop:{lvl:1,xp:0}, mine:{lvl:1,xp:0}, hunt:{lvl:1,xp:0}, fish:{lvl:1,xp:0}, explore:{lvl:1,xp:0}, cook:{lvl:1,xp:0}, combat:{lvl:1,xp:0}};
    g.gold = 0;
    g.lastSeen = Date.now();
    g.autoAction = null;
  }
  if(fmt < 3){
    // v2 → v3：二阶制作设施字段（默认未制作）
    if(!g.items) g.items={};
    ['ironAxe','steel','farm','tower','forge'].forEach(k=>{ if(!(k in g.items)) g.items[k]=false; });
    g.offToday = {fire:false, puri:false, trap:false};
  }
  if(fmt < 4){
    // v3 → v4：强化系统 / 合金资源 / 传说武器
    if(!g.items) g.items={};
    if(!('huntKing' in g.items)) g.items.huntKing=false;
    if(!g.res) g.res={};
    if(!('alloy' in g.res)) g.res.alloy=0;
    g.upgrades = {weapon:0, axe:0, rod:0, trap:0};
  }
  if(fmt < 5){
    // v4 → v5：符石资源 + Tier 4 终极制作字段
    if(!g.items) g.items={};
    if(!g.res) g.res={};
    if(!('rune' in g.res)) g.res.rune=0;
    ['runeBlade','runeArmor','forgeMast','vault'].forEach(k=>{ if(!(k in g.items)) g.items[k]=false; });
  }
  if(fmt < 6){
    // v5 → v6：Tier 5 自动生产设备字段
    if(!g.items) g.items={};
    ['autokitchen','solarBoiler'].forEach(k=>{ if(!(k in g.items)) g.items[k]=false; });
  }
  if(fmt < 7){
    // v6 → v7：附魔系统字段（附魔台设施 + 附魔状态）
    if(!g.items) g.items={};
    if(!('enchantTbl' in g.items)) g.items.enchantTbl=false;
    if(!g.enchant) g.enchant={tblLv:0, weapon:0, armor:0, tool:0};
    else { if(!('tblLv' in g.enchant)) g.enchant.tblLv=0; ['weapon','armor','tool'].forEach(k=>{ if(!(k in g.enchant)) g.enchant[k]=0; }); }
  }
  if(fmt < 8){
    // v7 → v8：装备系统字段（护甲 + 矿石/锭资源）
    if(!g.items) g.items={};
    if(!('armor' in g.items)) g.items.armor='none';
    if(!g.res) g.res={};
    ['copperOre','silverOre','goldOre','copper','silver','gold'].forEach(k=>{ if(!(k in g.res)) g.res[k]=0; });
  }
  if(fmt < 9){
    // v8 → v9：4 部位装备（旧 armor → armorBody）
    if(!g.items) g.items={};
    const oldArmor = g.items.armor || 'none';
    ['head','body','legs','boots'].forEach(s=>{
      const k='armor'+s[0].toUpperCase()+s.slice(1);
      if(!(k in g.items)) g.items[k]='none';
    });
    if(oldArmor!=='none' && g.items.armorBody==='none') g.items.armorBody=oldArmor;
    delete g.items.armor;
  }
  if(fmt < 10){
    // v9 → v10：肾上腺素消耗品字段
    if(!g.res) g.res={};
    if(!('adrenaline' in g.res)) g.res.adrenaline=0;
    if(!('adrenalineLeft' in g)) g.adrenalineLeft=0;
  }
  if(fmt < 11){
    // v10 → v11：怪物图鉴解锁记录 bestiary。老存档按历史战绩粗略补解锁（遭遇/击杀过的大致推断）
    g.bestiary = legacyBestiary(g);
  }
  g.v = SAVE_FMT;
  return g;
}

function serialize(){ return JSON.stringify({tag:SAVE_TAG, fmt:SAVE_FMT, ver:GAME_VERSION, g:G}) }
function toB64(s){ return btoa(unescape(encodeURIComponent(s))) }
function fromB64(s){ return decodeURIComponent(escape(atob(s))) }

function parseSavePayload(data){
  // 兼容旧版存档标识 EMBER1（v1.0.0 导出）
  const okTag = data && (data.tag===SAVE_TAG || data.tag==='EMBER1');
  if(!okTag || !data.g) return null;
  const fmt = data.fmt|0 || (data.v|0 || 1);
  return normalizeState(migrateFrom(data.g, fmt));
}

/* 离线收益结算（Melvor 式：关掉游戏也涨进度）
   按离线时长结算被动设施产出，封顶 8 小时。 */
function settleOffline(ms){
  const hours=Math.min(ms/3600000, 8);
  if(hours<0.15) return; // 少于9分钟不结算
  const h=Math.floor(hours*2)/2; // 半小时粒度
  let gains=[];
  const foodN=Math.floor(h*1.2*(has('trap')?1:0) + h*0.5*(has('farm')?1:0));
  const cleanN=has('puri')? Math.floor(h*0.6) : 0;
  const woodN=(G.items.axe||G.items.ironAxe)? Math.floor(h*1.5) : 0;
  if(foodN>0){ addRes('food',foodN); gains.push(`${RES_NAMES.food} ×${foodN}`); }
  if(cleanN>0){ addRes('clean',cleanN); gains.push(`${RES_NAMES.clean} ×${cleanN}`); }
  if(woodN>0){ addRes('wood',woodN); gains.push(`${RES_NAMES.wood} ×${woodN}`); }
  // 冬季无火堆离线会受冻（封顶扣到 20，不致死）
  if(G.season===3 && !has('fire') && !G.dead){
    G.hp=Math.max(20, G.hp - Math.floor(h*0.6));
    log(`⛄ 你离线时正值寒冬且没有火堆，生命降至 ${G.hp}。`,'bad');
  }
  // 离线期间也消耗少量生存物资
  G.food=clamp(G.food - Math.floor(h*2), 0, 100);
  G.water=clamp(G.water - Math.floor(h*2.5), 0, 100);
  G.stam=clamp(G.stam + Math.floor(h*15), 0, 100);
  G.day += Math.floor(h/24);
  log(`⏳ 你离开了 ${Math.round(h*10)/10} 小时，期间${gains.length? '获得了：'+gains.join('、') : '平安无事'}。`,'info');
}

function save(){
  if(G) G.lastSeen=Date.now();
  try{ localStorage.setItem(SAVE_KEY, serialize()); }catch(e){}
}
function hasSave(){ return !!localStorage.getItem(SAVE_KEY) }
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    const wasImported=!!data._imported;
    const g=parseSavePayload(data);
    if(!g) return false;
    G=g; logBuffer=[];
    const rawTs=(data.g&&data.g.lastSeen)|0 || Date.now();
    // 旧存档/导入存档跳过离线结算，避免更新游戏后刷新页面掉饥饿坏档
    if(wasImported){

/* 导出 */
function exportCode(){
  return SAVE_TAG + ':' + toB64(serialize());
}
/* 二维码专用压缩格式：EMQR1: + LZ压缩(JSON) */
function exportQRCode(){
  return 'EMQR1:' + LZString.compressToBase64(serialize());
}
/* 统一解析存档代码：EMBER:（标准）/ EMBER1:（v1.0.0 旧版）/ EMQR1:（二维码压缩版） */
function parseImportCode(code){
  code=(code||'').trim();
  if(!code) return null;
  try{
    if(code.startsWith('EMQR1:')){
      const json=LZString.decompressFromBase64(code.slice(6));
      const data=JSON.parse(json);
      if(!data) return null;
      return {g:parseSavePayload(data), isOld:(data.fmt|0||1)<SAVE_FMT, tag:data.tag};
    }
    let body=null;
    if(code.startsWith(SAVE_TAG+':')) body=code.slice(SAVE_TAG.length+1);
    else if(code.startsWith('EMBER1:')) body=code.slice(7);
    if(body===null) return null;
    const data=JSON.parse(fromB64(body));
    if(!data) return null;
    return {g:parseSavePayload(data), isOld:code.startsWith('EMBER1:')||(data.fmt|0||1)<SAVE_FMT, tag:data.tag};
  }catch(e){ return null }
}
/* 生成二维码 canvas（qrcode-generator 库） */
function makeQRCanvas(text, size){
  const qr=qrcode(0,'M');
  qr.addData(text, 'Byte');
  qr.make();
  const n=qr.getModuleCount();
  const pad=4;
  const cell=Math.floor((size-pad*2)/n);
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=n*cell+pad*2;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect(c*cell+pad, r*cell+pad, cell, cell);
  return canvas;
}

/* ---------------- 摄像头扫码导入（jsQR） ---------------- */
let scannerStream=null, scanTimer=null;
function startScanner(){
  const sc=document.getElementById('scanner');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR!=='function'){
    toast('当前浏览器不支持摄像头扫码，请使用「粘贴存档代码」');
    return;
  }
  sc.classList.add('show');
  const video=document.getElementById('scanVideo');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false})
    .then(stream=>{
      scannerStream=stream;
      video.srcObject=stream;
      video.play().catch(()=>{});
      scanTimer=setInterval(scanTick, 400);
    })
    .catch(()=>{
      sc.classList.remove('show');
      toast('无法访问摄像头，请授予相机权限或用粘贴导入');
    });
}
function scanTick(){
  const video=document.getElementById('scanVideo');
  if(!video || video.readyState<2 || !video.videoWidth) return;
  const scale=0.5;
  const c=document.createElement('canvas');
  c.width=Math.round(video.videoWidth*scale);
  c.height=Math.round(video.videoHeight*scale);
  const ctx=c.getContext('2d');
  ctx.drawImage(video,0,0,c.width,c.height);
  let img;
  try{ img=ctx.getImageData(0,0,c.width,c.height); }catch(e){ return }
  const res=jsQR(img.data, img.width, img.height);
  if(res && res.data){
    stopScanner(true);
    const parsed=parseImportCode(res.data);
    if(parsed && parsed.g){
      G=parsed.g; logBuffer=[];
      // 写本地存档时打上 _imported 标记，下次刷新跳过离线结算
      try{
        const obj=JSON.parse(serialize());
        obj._imported=1;
        localStorage.setItem(SAVE_KEY, JSON.stringify(obj));
      }catch(e){ localStorage.setItem(SAVE_KEY, serialize()); }
      log(`📥 扫码导入成功${parsed.isOld ? '（旧版存档已自动升级）' : ''}！`,'good');
      log('已标记为导入存档，下次刷新页面将跳过离线结算（防坏档）','sys');
      renderAll();
      toast('扫码导入成功');
    } else {
      toast('扫到的内容不是有效存档');
    }
  }
}
function stopScanner(silent){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  const sc=document.getElementById('scanner');
  if(sc) sc.classList.remove('show');
  if(!silent) toast('已取消扫码');
}

/* ---------------- 进度总览 ---------------- */
function pbar(cur, max){
  const pct=Math.max(0, Math.min(100, Math.round(cur/max*100)));
  return `<div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><div class="pnum">${Math.round(cur)}/${max}（${pct}%）</div>`;
}
function nextNeedText(id){
  const r=RECIPES[id];
  if(!r) return '';
  let parts=[];
  for(const c in r.cost){
    const need=r.cost[c], have=G.res[c]||0;
    parts.push(`${RES_NAMES[c]||c} ${need}${have<need?'（缺'+need+'）':''}`);
  }
  return parts.join(' ');
}

function renderZone(){

    const zone=ZONES[k];
    const unlockDay=zone.unlockDay||1;
    if(G.day < unlockDay){
      // 未解锁：灰色锁定按钮（点击提示解锁条件）
      h+=`<button class="zonebtn" style="opacity:.4;cursor:not-allowed" onclick="toast('🔒 ${zone.name} 需存活至第 ${unlockDay} 天解锁')">🔒${zone.name}</button>`;

    const on = curZone===k ? 'on' : '';
    h+=`<button class="zonebtn zone-${k} ${on}" data-zone="${k}" style="--zone-color:${zone.color};--zone-bg:${zone.bg}" onclick="curZone='${k}';renderZone();renderActions()">${zone.name}</button>`;
  }

}

function renderActions(){
  const box=el('actions');
  let h='';
  if(curTab==='act'){
    // 需要消耗库存的按钮：显示当前库存数量
    const stockHtml = (a)=>{
      if(a.kind==='cook') return ` <span class="stock">🍖${G.res.food||0}</span>`;
      if(a.kind==='boil') return ` <span class="stock">💧${G.res.water||0}</span>`;
      if(a.kind==='heal') return ` <span class="stock">🌿${G.res.herb||0}</span>`;
      return '';
    };
    for(const k in ACTIONS){
      if(k==='eat'||k==='drink') continue; // 进食/饮水移至背包页
      const a=ACTIONS[k];
      const running = G.autoAction===k;
      const lvHtml = a.skill? `<span class="lv">Lv.${skillLvl(a.skill)}</span>` : '';
      // 自动解锁等级提示（v1.28.1）：技能未达标 → 🔒 手动模式
      const autoLock = a.auto && (a.autoLv||0) > skillLvl(a.skill);
      const subTxt = running ? '⏳ 进行中' : (autoLock ? `🔒 ${a.name}等级不足 · 手动中（Lv.${a.autoLv} 解锁自动）` : '·'+a.sub);
      h+=`<button class="actbtn${running?' running':''}" onclick="onActionBtn('${k}')">${a.name}${lvHtml}<span class="sub">${subTxt}${stockHtml(a)}</span></button>`;
    }
  } else if(curTab==='craft'){
    // 区块快捷导航（点击跳到对应区域）
    h+=`<div class="craftnav"><button class="cnav" onclick="scrollCraftTo('craft0')">⚒ 制作</button><button class="cnav" onclick="scrollCraftTo('craftArmor')">🛡 装备</button><button class="cnav" onclick="scrollCraftTo('craftUp')">⬆ 强化</button><button class="cnav" onclick="scrollCraftTo('craftEn')">🔮 附魔</button></div>`;
    // 基础/进阶/传说/终极/自动化 5 组
    const groups=[[1,'⚒ 基础'],[2,'🔩 进阶'],[3,'🗡 传说'],[4,'🔮 终极'],[5,'⚡ 自动化']];
    groups.forEach(g=>{
      // 材料过滤（v1.28.0）：已解锁配方永远显示；未解锁的需拥有/获取过至少一种材料类型
      const list=Object.keys(RECIPES).filter(k=>RECIPES[k].tier===g[0] && (G.items[k] || recipeVisible(k)));
      if(!list.length) return;
      h+=`<div class="craft-sep" id="craft0">${g[1]}</div>`;
      list.forEach(k=>{
        const r=RECIPES[k];
        if(G.items[k]){ h+=`<button class="actbtn" disabled>✅ ${r.name}<span class="sub">已制作</span></button>`; return }
        // 等级门槛（v1.30.1）：未达等级先显示等级要求（灰暗禁用、不显示材料），达标后才显示材料成本
        const lvNeed = r.needLv && r.skill && skillLvl(r.skill) < r.needLv;
        if(lvNeed){
          h+=`<button class="actbtn actbtn-dis" onclick="doCraft('${k}')">${r.name}<span class="sub">🔒 需要 ${SKILL_NAMES[r.skill]||r.skill} Lv.${r.needLv}（当前 Lv.${skillLvl(r.skill)}）</span></button>`;
          return;
        }
        let cost=[]; for(const c in r.cost){
          const need=r.cost[c], have=G.res[c]||0;
          const needHtml = have<need ? `<span style="color:var(--bad);font-weight:700">${need}</span>` : need;
          cost.push(`${RES_NAMES[c]}${needHtml}<span style="opacity:.65">(${have})</span>`);
        }
        const can=hasRes(r.cost);
        const needTxt = r.need? '需'+RECIPES[r.need].name+' ' : '';
        h+=`<button class="actbtn ${can?'':'actbtn-dis'}" onclick="doCraft('${k}')">${r.name}<span class="sub">${needTxt}${cost.join(' ')}</span></button>`;
      });

function setSellQty(v){
  const inp=el('sellNum'); if(!inp||!sellTarget) return;
  const max=G.res[sellTarget.k]||0;
  if(v==='all') inp.value = max;
  else if(v==='half') inp.value = Math.max(1, Math.floor(max/2));
  else inp.value = v;
  updateSellPreview();
  // 让用户继续编辑：从末尾放光标
  try{ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){}

function updateSellPreview(){
  const inp=el('sellNum'); if(!inp||!sellTarget) return;
  const raw=inp.value;  // 用户输入的原文（保留空字符串状态）
  let n=parseInt(raw,10);
  if(isNaN(n)) n=0;  // 空值/NaN → 0（预览 0 不报错）
  const max=G.res[sellTarget.k]||0;
  n=Math.max(0, Math.min(n, max));
  el('sellGain').textContent = n*sellTarget.price;

  if(!sellTarget) return;
  const inp=el('sellNum'); if(!inp) return;

  log(`💸 卖出 ${RES_NAMES[sellTarget.k]} ×${n}，获得 ${gain} 金币。`,'good');

/* ---------------- 防崩溃回退机制 ----------------
   工作原理：
   ① 每次启动时写一个时间戳哨兵到 localStorage。
   ② 启动成功（setTimeout 500ms 内无致命错误）则清除哨兵 + 异步备份当前 HTML 到 localStorage。
   ③ 下次启动时若发现哨兵仍在（且 < 1h）→ 上次崩溃 → 显示降级页，提供「加载上次成功版本」按钮。
   ④ 降级方案：从 localStorage 取回上次能跑的完整 HTML，用 Blob URL 在新页面加载。 */
const EBH_BOOT = '__ebh_booting_v1';
const EBH_BACKUP = '__ebh_backup_v1';
const EBH_BACKUP_N = '__ebh_backup_n';
const EBH_BACKUP_VER = '__ebh_backup_ver';
const EBH_BACKUP_BUILD = '__ebh_backup_build';
const EBH_FALLBACK_FLAG = '__ebh_fallback';

function ebhStartSentinel(){ try{ localStorage.setItem(EBH_BOOT, String(Date.now())); }catch(e){} }
function ebhClearSentinel(){ try{ localStorage.removeItem(EBH_BOOT); }catch(e){} }
function ebhDetectCrash(){
  const ts = parseInt(localStorage.getItem(EBH_BOOT)||'0', 10);
  if(!ts) return false;
  return Date.now()-ts < 3600000; // 1 小时内 = 上次启动没完成
}
function ebhBackupCurrent(){
  // 异步备份当前页面 HTML（fetch 同源 + 走浏览器缓存）
  try{
    fetch(location.href, {cache:'no-store'}).then(r=>r.ok?r.text():null).then(html=>{
      if(!html) return;
      try{
        const chunkSize = 100000; // 每块 100KB
        const chunks=[]; for(let i=0;i<html.length;i+=chunkSize) chunks.push(html.slice(i,i+chunkSize));
        // 清旧备份
        const oldN = parseInt(localStorage.getItem(EBH_BACKUP_N)||'0',10);
        for(let i=0;i<oldN;i++) try{ localStorage.removeItem(EBH_BACKUP+'_'+i); }catch(e){}
        // 写新备份
        chunks.forEach((c,i)=>{ try{ localStorage.setItem(EBH_BACKUP+'_'+i, c); }catch(e){} });
        localStorage.setItem(EBH_BACKUP_N, String(chunks.length));
        try{ localStorage.setItem(EBH_BACKUP_VER, GAME_VERSION); }catch(e){}
        try{ localStorage.setItem(EBH_BACKUP_BUILD, String(BUILD_CODE)); }catch(e){}
      }catch(e){ console.warn('[ebh] backup quota fail:', e.message); }
    }).catch(e=>console.warn('[ebh] backup fetch fail:', e.message));
  }catch(e){}
}
function ebhRestoreBackup(){
  const n = parseInt(localStorage.getItem(EBH_BACKUP_N)||'0',10);
  if(!n) return null;
  let html='';
  for(let i=0;i<n;i++){
    const part = localStorage.getItem(EBH_BACKUP+'_'+i);
    if(!part) return null;
    html += part;
  }
  return {
    html,
    ver: localStorage.getItem(EBH_BACKUP_VER),
    build: localStorage.getItem(EBH_BACKUP_BUILD),
  };
}
function ebhLoadBackup(){
  const r = ebhRestoreBackup();
  if(!r){ alert('没有可用的旧版本备份。'); return; }
  // 清除哨兵防止备份版再次被检测为崩溃
  ebhClearSentinel();
  try{ sessionStorage.setItem(EBH_FALLBACK_FLAG, '1'); }catch(e){}
  try{
    const blob = new Blob([r.html], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    location.replace(url);
  }catch(e){
    alert('加载旧版本失败：'+(e.message||e));
  }
}
function ebhExportCrashSave(){
  // 即便主页面崩了，也要把 localStorage 里的存档导出来
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ alert('本地没有存档可导出。'); return; }
    const data = decodeURIComponent(escape(atob(raw)));
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ember-save-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
  }catch(e){
    alert('导出失败：'+(e.message||e));
  }
}
window.ebhLoadBackup = ebhLoadBackup;
window.ebhExportCrashSave = ebhExportCrashSave;
function ebhForceReload(){
  try{ sessionStorage.removeItem(EBH_BOOT); }catch(e){}
  try{ sessionStorage.removeItem(EBH_FALLBACK_FLAG); }catch(e){}
  // 加随机 query 强制绕过浏览器缓存
  const u = location.pathname + '?v=' + Date.now();
  location.replace(u);
}
window.ebhForceReload = ebhForceReload;

function ebhShowCrashPage(detail){
  // detail: { isOldCrash:bool, backup:obj|null, err:Error|null }
  const isOld = !!(detail && detail.isOldCrash);
  const backup = detail && detail.backup;
  const err = detail && detail.err;
  const errMsg = err ? (err.message||String(err)) : (isOld ? '上一次启动未在 1 小时内完成哨兵清除（页面崩溃 / 卡死）' : '');
  const verStr = (typeof GAME_VERSION!=='undefined'?GAME_VERSION:'?') + ' build ' + (typeof BUILD_CODE!=='undefined'?BUILD_CODE:'?');
  const backupStr = backup ? ('v'+(backup.ver||'?')+' build '+(backup.build||'?')) : '暂无';
  document.body.innerHTML = `
    <div style="position:fixed;inset:0;background:#1a1108;color:#f5e6d3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;z-index:99999">
      <div style="max-width:440px;width:100%;background:#2a1e10;border:1px solid #5a4020;border-radius:14px;padding:22px;text-align:center;line-height:1.6">
        <div style="font-size:54px;margin-bottom:10px">💥</div>
        <h2 style="margin:0 0 8px;color:#ff9a3c;font-size:18px">末日余烬 v${typeof GAME_VERSION!=='undefined'?GAME_VERSION:'?'} 启动失败</h2>
        <div style="font-size:12px;color:#9a8060;margin-bottom:14px">检测到版本：v${verStr} · 备份版本：${backupStr}</div>
        ${errMsg?`<pre style="background:#1a0e05;border:1px solid #5a4020;border-radius:8px;padding:10px;font-size:11px;color:#ff9a3c;text-align:left;white-space:pre-wrap;word-break:break-all;margin:0 0 14px;max-height:140px;overflow:auto">${errMsg.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</pre>`:''}
        ${backup?`<button onclick="ebhLoadBackup()" style="display:block;width:100%;padding:14px;margin-bottom:10px;border-radius:10px;border:none;background:#ff9a3c;color:#1a1108;font-size:15px;font-weight:700;cursor:pointer">↩️ 加载上次能玩的版本（v${backup.ver} build ${backup.build}）</button>`:''}
        <button onclick="ebhForceReload()" style="display:block;width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #ff9a3c;background:transparent;color:#ff9a3c;font-size:14px;font-weight:600;cursor:pointer">🔄 强制刷新（拉取最新版）</button>
        <button onclick="ebhExportCrashSave()" style="display:block;width:100%;padding:12px;border-radius:10px;border:1px solid #5a4020;background:transparent;color:#f5e6d3;font-size:14px;cursor:pointer">📤 先导出当前存档（避免进度丢失）</button>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid #5a4020;font-size:11.5px;color:#9a8060;line-height:1.7">
          通常是因为新版本有 Bug。开发者修复后再次刷新即可。<br>
          若选择「加载旧版本」会在新页面载入完整备份，游戏进度不受影响。
        </div>
      </div>
    </div>
  `;
}

// 全局未捕获错误 → 在启动阶段就把页面切成降级页
window.addEventListener('error', e=>{
  if(window.__ebhBooting){
    window.__ebhBooting = false;
    ebhClearSentinel();
    ebhShowCrashPage({isOldCrash:false, backup:ebhRestoreBackup(), err:e.error||new Error(e.message||'未知错误')});
    e.preventDefault && e.preventDefault();
  }
});

/* ---------------- 启动 ---------------- */
document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});
el('btnMenu').addEventListener('click', openMenu);
let folded=false;
el('btnFold').addEventListener('click', ()=>{
  folded=!folded;
  updateBottomVisibility();
  el('btnFold').textContent = folded?'▴':'▾';
  el('logwrap').scrollTop = el('logwrap').scrollHeight;
});
el('modal').addEventListener('click', e=>{ if(e.target===el('modal')) closeModal() });
// 探索/战斗事件弹窗（evmask）：不允许点击外部暗区跳过——对话和战斗必须主动选择
// （v1.19.1 修复：误触遮罩会静默关闭事件弹窗导致跳过对话）

// 检测上次是否崩溃
if(ebhDetectCrash()){
  // 哨兵仍在 → 上次没启动完
  const backup = ebhRestoreBackup();
  if(backup){
    // 有备份：显示降级页，让用户选择
    ebhShowCrashPage({isOldCrash:true, backup, err:null});
    // 停在这里，不执行后续启动
  } else {
    // 没备份：清哨兵继续尝试（避免无限循环）
    ebhClearSentinel();
    ebhStartSentinel();
  }
}
if(window.__ebhBooting !== false){
  window.__ebhBooting = true;
  ebhStartSentinel();
  try{
    const loaded = hasSave() && loadSave();
    if(!loaded) newGame();
    // 启动成功：500ms 后清哨兵 + 异步备份
    setTimeout(()=>{
      ebhClearSentinel();
      window.__ebhBooting = false;
      ebhBackupCurrent();
    }, 500);
  }catch(err){
    ebhClearSentinel();
    window.__ebhBooting = false;
    ebhShowCrashPage({isOldCrash:false, backup:ebhRestoreBackup(), err});
  }
}

/* ============================================================
   PWA 能力层（v2.0.0）
   ------------------------------------------------------------
   · 安装引导：安卓 beforeinstallprompt + 菜单入口 + iOS 手动提示
   · 离线：SW 缓存 app shell（file:// 下不注册，游戏照常可用）
   · 更新：SW updatefound / controllerchange 提示 + 切前台比对 version.json
   · 存档安全：申请持久化存储，降低被浏览器清理的概率
   ============================================================ */
const PWA = { deferredPrompt:null, swReg:null, standalone:false, versionAsked:'' };
function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }

function pwaIsStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
}
function pwaIsIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function pwaCanInstall(){
  if(pwaIsStandalone()) return false;
  return !!PWA.deferredPrompt || pwaIsIOS();
}
function pwaBanner(text, onClick, closable){
  let box=document.getElementById('pwaBanner');
  if(!box){ box=document.createElement('div'); box.id='pwaBanner'; document.body.appendChild(box); }
  box.innerHTML = text + (closable ? '<span class="pwa-x">✕</span>' : '');
  box.onclick = (e)=>{
    if(e.target && e.target.className==='pwa-x'){ pwaHideBanner(); return; }
    if(onClick) onClick();
  };
  box.style.display='block';
}
function pwaHideBanner(){
  const box=document.getElementById('pwaBanner');
  if(box) box.style.display='none';
}
function pwaInstall(){
  if(PWA.deferredPrompt){
    const ev=PWA.deferredPrompt;
    PWA.deferredPrompt=null;
    try{ ev.prompt(); }catch(e){}
    if(ev.userChoice) ev.userChoice.then(()=>pwaHideBanner()).catch(()=>{});
    lsSet('pwa_tip_install','1');
    return;
  }
  if(pwaIsIOS()){
    pwaBanner('📲 iOS 安装：点底部「分享」→「添加到主屏幕」，之后可全屏离线玩', ()=>pwaHideBanner(), true);
  }
}
/* 版本比对（文档二·补救路径：SW 字节不变时靠页面静默比对 version.json） */
async function pwaCheckVersion(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('./version.json',{cache:'no-store'});
    if(!r.ok) return;
    const meta=await r.json();
    if(meta && meta.ver && meta.ver!==GAME_VERSION && PWA.versionAsked!==meta.ver){
      PWA.versionAsked=meta.ver;
      pwaBanner('🔥 发现新版本 v'+meta.ver+'，点此刷新');
    }
  }catch(e){}
}
(function pwaBoot(){
  PWA.standalone = pwaIsStandalone();

  /* 离线 / 在线 */
  window.addEventListener('offline', ()=>{
    pwaBanner('🌐✕ 当前离线：已缓存的版本仍可正常游玩');
  });
  window.addEventListener('online', ()=>{
    pwaHideBanner();
    if(typeof toast==='function') toast('🌐 网络已恢复');
  });
  /* 冷启动就是离线时 offline 事件不会触发，需主动检查（延迟到安装提示之后，优先级更高） */
  if(!navigator.onLine){
    setTimeout(()=>pwaBanner('🌐✕ 当前离线：已缓存的版本仍可正常游玩'), 1200);
  }

  /* 安装引导：Chromium 系 */
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    PWA.deferredPrompt=e;
    if(!lsGet('pwa_tip_install')) pwaBanner('📲 可安装到桌面，点此一键安装', ()=>pwaInstall());
  });
  window.addEventListener('appinstalled', ()=>{
    PWA.deferredPrompt=null;
    lsSet('pwa_tip_install','1');
    pwaHideBanner();
    if(typeof toast==='function') toast('✅ 已安装到桌面');
  });

  /* 安装引导：iOS 手动添加（只提示一次） */
  if(pwaIsIOS() && !PWA.standalone){
    setTimeout(()=>{
      if(lsGet('pwa_tip_ios')) return;
      pwaBanner('📲 点「分享」→「添加到主屏幕」，可全屏离线玩 <span style="opacity:.7">（点此关闭）</span>', ()=>{
        lsSet('pwa_tip_ios','1');
        pwaHideBanner();
      });
    }, 3500);
  }

  /* 存档安全：申请持久化存储（失败不影响游戏） */
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){}

  /* Service Worker 只在 https / localhost 注册（file:// 直接打开照常玩） */
  const canSW = 'serviceWorker' in navigator
    && (/^https:$/.test(location.protocol) || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname));
  if(!canSW) return;

  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' })
    .then((reg)=>{
      PWA.swReg = reg;
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          // 已有 controller 说明这是「更新」而不是首次安装
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            pwaBanner('🔥 新版本已下载，点此刷新生效', ()=>location.reload());
          }
        });
      });
    })
    .catch(()=>{});

  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController) return;   // 首次安装接管，不提示
    pwaBanner('🔥 已更新到新版本，点此刷新', ()=>location.reload());
  });

  /* 切回前台：两路兜底检查更新（SW update + version.json 比对） */
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) return;
    if(PWA.swReg && PWA.swReg.update) PWA.swReg.update().catch(()=>{});
    pwaCheckVersion();
  });
  setTimeout(pwaCheckVersion, 8000);
})();
</script>
