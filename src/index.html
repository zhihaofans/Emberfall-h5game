<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <!-- PWA：清单 + iOS 主屏图标 / 启动图（路径由 tools/build.mjs 原样复制到 dist/，不要改成构建哈希路径） -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="末日余烬">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="icon" href="./icons/favicon-32.png">
  <link rel="apple-touch-startup-image" href="./splash/splash-iphone13-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="./splash/splash-iphone15pro-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="./splash/splash-iphone15promax-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="./splash/splash-iphonex-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)">
  <link rel="apple-touch-startup-image" href="./splash/splash-iphoneSE-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
  <link rel="apple-touch-startup-image" href="./splash/splash-ipad12-2048x2732.png" media="(device-width:1024px) and (device-height:1366px) and (-webkit-device-pixel-ratio:2)">
  <title>末日余烬 · Emberfall</title>
</head>
<body>
  <!-- 顶部状态栏 -->
  <div id="statusbar">
    <div id="topline">
      <div id="dayinfo">第 <b id="v-day">1</b> 天 · <span id="v-phase">白天</span> · <span id="v-season">春季</span> · <span id="v-weather">晴</span> · <span id="goldinfo" style="color:var(--yellow)">💰0</span></div>
      <div id="topbtns">
        <button class="iconbtn" id="btnMenu" title="菜单">☰</button>
      </div>
    </div>
    <div id="stats">
      <div class="stat"><span class="lab">生命</span><div class="bar"><div class="fill" id="f-hp" style="background:var(--red)"></div></div><span class="val" id="v-hp">100</span></div>
      <div class="stat"><span class="lab">饱食</span><div class="bar"><div class="fill" id="f-food" style="background:var(--orange)"></div></div><span class="val" id="v-food">100</span></div>
      <div class="stat"><span class="lab">水分</span><div class="bar"><div class="fill" id="f-water" style="background:var(--blue)"></div></div><span class="val" id="v-water">100</span></div>
      <div class="stat"><span class="lab">精力</span><div class="bar"><div class="fill" id="f-stam" style="background:var(--yellow)"></div></div><span class="val" id="v-stam">100</span></div>
    </div>
  </div>

  <!-- 自动行动横幅 -->
  <div id="activebar">
    <span>⏳ 正在自动：<b id="activeName"></b></span>
    <button id="activeStop">■ 停止</button>
  </div>

  <!-- 日志 -->
  <div id="logwrap"></div>

  <!-- 底部操作区 -->
  <div id="bottom">
    <div id="tabs">
      <button id="btnFold" title="收起/展开操作区">▾</button>
      <button class="tab on" data-tab="act">行动</button>
      <button class="tab" data-tab="craft">制作</button>
      <button class="tab" data-tab="bag">背包</button>
    </div>
    <div id="zonebar"></div>
    <div id="actions"></div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal"><div id="modalcard"></div></div>
  <!-- 事件弹层 -->
  <div id="evmask"><div class="wrap" id="evwrap"></div></div>
  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>
  <!-- 扫码导入全屏层 -->
  <div id="scanner">
    <video id="scanVideo" playsinline muted></video>
    <div class="sframe"></div>
    <div class="sbar"></div>
    <div class="tip">正在识别…<br><span style="font-size:11px;opacity:.7">把二维码放进取景框，靠近一点、调亮屏幕</span></div>
    <button class="stop" id="scanStop">取 消</button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
