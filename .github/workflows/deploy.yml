name: Deploy

# 发布链路：CI（SSOT / 类型 / 单测 / e2e）全绿之后，把 dist/ 推到独立的 **gh-pages** 分支。
#
# 一次性设置（仓库管理员）：
#   Settings → Pages → Build and deployment → Source = **Deploy from a branch**
#   分支选 **gh-pages**，目录选 **/ (root)**
#
# 为什么用独立分支：
#   · 仓库源码分支保持干净（dist 不入库、不产生构建提交）
#   · gh-pages 只放运行时产物（强制单提交，体积不膨胀）
#   · 不依赖 Pages 的 Actions 部署环境；换静态托管时直接拉这个分支
#
# 为什么挂在 workflow_run 而不是直接 push：
#   避免「CI 红了但站点已经更新」——只有 CI 成功才部署。
#   手动触发（workflow_dispatch）用于补发与验证部署链路。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并推送到 gh-pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 事件的默认 SHA 是「CI 那次运行」的提交，显式取它更稳
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（Vite 多文件产物 + 注入 SW 预缓存清单 + git hash）
        run: npm run build

      - name: 发布到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(node -p "JSON.parse(require('fs').readFileSync('dist/version.json','utf8')).ver")
          SHA=$(node -p "JSON.parse(require('fs').readFileSync('dist/version.json','utf8')).sha || ''")
          cd dist
          touch .nojekyll                       # 跳过 Jekyll，按原样发布
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: v${VER} (${SHA})"
          # 强制覆盖：gh-pages 只保留当前这一版产物，历史不膨胀
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
